name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Generate signing keystore
        run: keytool -genkeypair -v -keystore android.keystore -storepass android -alias android -keypass android -dname "CN=Calendar, OU=Calendar, O=Calendar, L=HK, S=HK, C=HK" -keyalg RSA -keysize 2048 -validity 10000

      - name: Write Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_HOME"}
          EOF
          cat ~/.bubblewrap/config.json

      - name: Initialize TWA project
        run: |
          mkdir -p android
          expect -c 'set timeout 180
          spawn npx @bubblewrap/cli init --manifest="https://deliciouskfc.github.io/calendar-reminder/manifest.json" --directory="android"
          expect {
            -re {(?i)create|directory.*exist} { send "y\r"; exp_continue }
            -re {\(y/N\)|\(Y/n\)} { send "y\r"; exp_continue }
            -re {(?i)name|package|hostname|display} { send "\r"; exp_continue }
            -re {(?i)signing|keystore|password|path} { send "\r"; exp_continue }
            eof
          }'

      - name: Build APK
        run: |
          cd android
          expect -c 'set timeout 900
          spawn npx @bubblewrap/cli build
          expect {
            -exact "Do you want Bubblewrap to install the JDK" { send "n\r"; exp_continue }
            -exact "Path to your existing JDK" { send "$env(JAVA_HOME)\r"; exp_continue }
            -re {\(y/N\)|\(Y/n\)} { send "y\r"; exp_continue }
            -exact "password" { send "\r"; exp_continue }
            eof
          }'

      - name: Find APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
          echo "=== full android tree ==="
          find android/ -type f 2>/dev/null | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: |
            android/app/build/outputs/
            **/*.apk
          if-no-files-found: warn
