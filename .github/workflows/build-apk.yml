name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Generate signing keystore
        run: keytool -genkeypair -v -keystore android.keystore -storepass android -alias android -keypass android -dname "CN=Calendar, OU=Calendar, O=Calendar, L=HK, S=HK, C=HK" -keyalg RSA -keysize 2048 -validity 10000

      - name: Initialize TWA project
        run: |
          mkdir -p android
          expect -c 'set timeout 180
          spawn npx @bubblewrap/cli init --manifest="https://deliciouskfc.github.io/calendar-reminder/manifest.json" --directory="android"
          expect {
            -re {(?i)create|directory.*exist} { send "y\r"; exp_continue }
            -re {(?i)name|package|hostname} { send "\r"; exp_continue }
            -re {(?i)signing|keystore|password} { send "\r"; exp_continue }
            -re {(?i)agreement|license|download|install} { send "y\r"; exp_continue }
            eof
          }'

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd android
          # Write JDK path to a file for expect to read
          echo "$JAVA_HOME" > /tmp/jdk_path.txt
          expect -c 'set timeout 900
          spawn npx @bubblewrap/cli build
          expect {
            -re {(?i)JDK.*install.*recommended} { send "n\r"; exp_continue }
            -re {(?i)path.*to.*your.*existing.*jdk} {
              set f [open "/tmp/jdk_path.txt" r]
              set jdkpath [read $f]
              close $f
              send "$jdkpath\r"
              exp_continue
            }
            -re {(?i)path.*jdk} {
              set f [open "/tmp/jdk_path.txt" r]
              set jdkpath [read $f]
              close $f
              send "$jdkpath\r"
              exp_continue
            }
            -re {(?i)agreement|license} { send "y\r"; exp_continue }
            -re {(?i)download|install} { send "y\r"; exp_continue }
            -re {(?i)signing|keystore|password} { send "\r"; exp_continue }
            eof
          }'

      - name: Find APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
          echo "=== android dir ==="
          ls -la android/ 2>/dev/null || echo "no android dir"
          echo "=== release dir ==="
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "no apk release dir"
          echo "=== full android tree ==="
          find android/ -type f 2>/dev/null | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: |
            android/app/build/outputs/
            **/*.apk
          if-no-files-found: warn
