name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo '{
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }' > ~/.bubblewrap/config.json
          echo "y" | bubblewrap doctor || true

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -storepass android \
            -alias android \
            -keypass android \
            -dname "CN=Calendar, OU=Calendar, O=Calendar, L=HK, S=HK, C=HK" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Initialize TWA project
        run: |
          echo "1" | bubblewrap init \
            --manifest="https://deliciouskfc.github.io/calendar-reminder/manifest.json" \
            --directory="android"

      - name: Build APK
        run: |
          cd android
          echo "y" | bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: android/app-release-signed.apk
