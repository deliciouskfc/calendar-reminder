name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/googlechromelabs/bubblewrap:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -storepass android \
            -alias android \
            -keypass android \
            -dname "CN=Calendar, OU=Calendar, O=Calendar, L=HK, S=HK, C=HK" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Initialize TWA
        run: |
          mkdir -p android
          printf "y\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\n" | bubblewrap init \
            --manifest="https://deliciouskfc.github.io/calendar-reminder/manifest.json" \
            --directory="android" || echo "init done (or skipped)"

      - name: Build APK
        run: |
          cd android
          printf "y\ny\ny\ny\n" | bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: android/app-release-signed.apk
