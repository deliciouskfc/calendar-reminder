name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Use committed signing keystore
        run: cp calendar.keystore /tmp/android.keystore

      - name: Create TWA project manually
        run: |
          mkdir -p android
          cat > android/twa-manifest.json << MANIFEST
          {
            "packageId": "com.calendar.app",
            "host": "deliciouskfc.github.io",
            "name": "日历课表",
            "launcherName": "日历课表",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#4f8ef7",
            "navigationColor": "#4f8ef7",
            "navigationColorDark": "#4f8ef7",
            "navigationDividerColor": "#4f8ef7",
            "navigationDividerColorDark": "#4f8ef7",
            "backgroundColor": "#f5f7fa",
            "enableNotifications": true,
            "startUrl": "/calendar-reminder/index.html",
            "iconUrl": "https://raw.githubusercontent.com/deliciouskfc/calendar-reminder/${GITHUB_SHA}/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/deliciouskfc/calendar-reminder/${GITHUB_SHA}/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "/tmp/android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.1.1",
            "appVersionCode": 5,
            "sdkVersion": "34",
            "enableSiteSettingsShortcut": false,
            "features": []
          }
          MANIFEST
          cat android/twa-manifest.json

      - name: Write Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Build APK
        run: |
          cd android
          expect -c 'set timeout 900
          spawn npx @bubblewrap/cli build
          expect {
            -exact "Do you want Bubblewrap to install the JDK" { send "n\r"; exp_continue }
            -exact "Path to your existing JDK" { send "$env(JAVA_HOME)\r"; exp_continue }
            -exact "versionCode for the new App version" { send "5\r"; exp_continue }
            -exact "versionName for the new App version" { send "1.1.1\r"; exp_continue }
            -re {\(y/N\)|\(Y/n\)} { send "y\r"; exp_continue }
            -exact "password" { send "android\r"; exp_continue }
            -exact "Password" { send "android\r"; exp_continue }
            eof
          }'

      - name: Find APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
          echo "=== full android tree ==="
          find android/ -type f 2>/dev/null | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: |
            android/app/build/outputs/
            **/*.apk
          if-no-files-found: warn
