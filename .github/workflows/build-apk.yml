name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/googlechromelabs/bubblewrap:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install expect
        run: apt-get update && apt-get install -y expect

      - name: Pre-configure Bubblewrap + auto-accept SDK licenses
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          # Accept Android SDK licenses silently
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Config:" && cat "$HOME/.bubblewrap/config.json"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -storepass android \
            -alias android \
            -keypass android \
            -dname "CN=Calendar, OU=Calendar, O=Calendar, L=HK, S=HK, C=HK" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Initialize TWA with expect (handle all prompts)
        run: |
          mkdir -p android
          expect << 'EXPECT_EOF'
          set timeout 120
          spawn bubblewrap init --manifest="https://deliciouskfc.github.io/calendar-reminder/manifest.json" --directory="android"
          expect {
            -re {(?i)create} { send "y\r"; exp_continue }
            -re {(?i)directory.*exist} { send "y\r"; exp_continue }
            -re {(?i)name.*\?} { send "\r"; exp_continue }
            -re {(?i)package} { send "com.calendar.app\r"; exp_continue }
            -re {(?i)hostname} { send "deliciouskfc.github.io\r"; exp_continue }
            -re {(?i)signing|keystore|alias|password|pass} { send "\r"; exp_continue }
            -re {(?i)agreement|license} { send "y\r"; exp_continue }
            -re {(?i)download|install} { send "y\r"; exp_continue }
            eof
          }
          EXPECT_EOF

      - name: Build APK with expect
        run: |
          cd android
          expect << 'EXPECT_EOF'
          set timeout 300
          spawn bubblewrap build
          expect {
            -re {(?i)agreement|license} { send "y\r"; exp_continue }
            -re {(?i)download|install} { send "y\r"; exp_continue }
            -re {(?i)signing|keystore|password|pass} { send "\r"; exp_continue }
            eof
          }
          EXPECT_EOF

      - name: List build outputs and find APK
        run: |
          echo "=== android/ contents ==="
          ls -la android/
          echo "=== Looking for APKs ==="
          find android/ -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | tee /tmp/apk_paths.txt
          echo "=== Looking for keystore ==="
          find . -name "*.keystore" 2>/dev/null
          echo "=== android/app contents ==="
          ls -la android/app/ 2>/dev/null || true
          echo "=== Recursive ==="
          ls -R android/ 2>/dev/null | head -80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: android/**/*.apk
