name: Course Reminder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check script
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python check.py
