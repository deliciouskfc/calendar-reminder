<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f8ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日历课表">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>我的日历 & 课表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #e4e8f0;
    color: #2c3e50;
    min-height: 100vh;
    padding: 0;
    -webkit-text-size-adjust: 100%;
  }
  .container {
    max-width: 100%;
    margin: 0;
    background: #fff;
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #5a6fd6 0%, #6a4f9e 100%);
    color: #fff;
    padding: 16px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 19px; font-weight: 700; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.3); }
  /* 检查更新按钮（渐变高亮款） */
  .btn.btn-update {
    background: linear-gradient(135deg, #5a6fd6, #6a4f9e);
    color: #fff;
    border: none;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(90, 111, 214, 0.35);
  }
  .btn.btn-update:hover { background: linear-gradient(135deg, #4d61c9, #5d4490); }
  .btn.btn-update:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(90, 111, 214, 0.3); }
  .btn.btn-update:disabled { opacity: 0.75; transform: none; }
  .btn-primary { background: #4e5db0; border-color: #4e5db0; }
  .btn-primary:hover { background: #3e4d9e; }
  .btn-danger { background: #e74c3c; border-color: #e74c3c; }

  /* ===== View Tabs ===== */
  .view-tabs {
    display: flex;
    padding: 12px 28px 0;
    gap: 2px;
    background: #fff;
    border-bottom: 1px solid #eef0f5;
  }
  .view-tab {
    padding: 8px 18px;
    border: none;
    background: none;
    font-size: 14px;
    font-weight: 500;
    color: #95a5a6;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.15s;
    position: relative;
  }
  .view-tab:hover { color: #5a6fd6; background: #f5f6fa; }
  .view-tab.active {
    color: #5a6fd6;
    background: #f5f6fa;
    font-weight: 600;
  }
  .view-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 10%;
    right: 10%;
    height: 3px;
    background: linear-gradient(90deg, #5a6fd6, #6a4f9e);
    border-radius: 3px 3px 0 0;
  }

  /* ===== Main Layout ===== */
  .main {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
    min-height: 540px;
  }
  .hidden { display: none !important; }

  /* ===== Calendar View ===== */
  .calendar-section { padding: 22px; }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .calendar-title { font-size: 19px; font-weight: 700; color: #2c3e50; }
  .nav-buttons { display: flex; gap: 6px; }
  .nav-btn {
    background: #f0f2f8;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    color: #5a6fd6;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #e2e5f0; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #95a5a6;
    padding: 6px 0;
  }
  .weekday.weekend { color: #e74c3c; }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day {
    min-height: 72px;
    border: 1px solid #eef0f5;
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
    position: relative;
    overflow: hidden;
  }
  .day:hover {
    border-color: #5a6fd6;
    box-shadow: 0 2px 8px rgba(90,111,214,0.15);
  }
  .day.other-month { background: #fafbfc; color: #cbd5db; }
  .day.past { background: #fafbfc; color: #cbd5db; cursor: default; }
  .day.past:hover { border-color: #eef0f5; box-shadow: none; }
  .day.today {
    background: linear-gradient(135deg, rgba(90,111,214,0.1), rgba(106,79,158,0.1));
    border-color: #5a6fd6;
    font-weight: 700;
  }
  .day.selected {
    border-color: #6a4f9e;
    box-shadow: 0 0 0 2px rgba(106,79,158,0.18);
  }
  .day.has-events::after {
    content: '';
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    background: #e74c3c;
    border-radius: 50%;
  }
  /* 节假日底色 */
  .day.holiday {
    background: linear-gradient(135deg, #ffeaea, #ffd6d6);
    border-color: #f5b7b1;
  }
  .day.holiday .day-number::before {
    content: '🏖 ';
  }
  /* 考试期底色 */
  .day.exam {
    background: linear-gradient(135deg, #fef9e7, #fdebd0);
    border-color: #f5cba7;
  }
  .day.exam .day-number::before {
    content: '📝 ';
  }
  /* 独立探索期 */
  .day.independent {
    background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
    border-color: #a9dfbf;
  }
  /* 补课日 */
  .day.makeup {
    background: linear-gradient(135deg, #f5eef8, #e8daef);
    border-color: #d2b4de;
  }
  .day.makeup .day-number::before {
    content: '🔄 ';
  }
  /* 周次标签 - 移到右上角避免与日期重叠 */
  .day-week-tag {
    position: absolute;
    top: 2px;
    right: 3px;
    font-size: 9px;
    color: #8e44ad;
    font-weight: 600;
    background: rgba(142,68,173,0.12);
    padding: 0 3px;
    border-radius: 3px;
    line-height: 1.3;
    z-index: 2;
  }
  .day-holiday-label {
    position: absolute;
    bottom: 2px;
    left: 4px;
    font-size: 9px;
    color: #c0392b;
    font-weight: 500;
    background: rgba(255,255,255,0.7);
    padding: 0 3px;
    border-radius: 3px;
    line-height: 1.3;
    max-width: calc(100% - 8px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .day-number { font-size: 13px; margin-bottom: 2px; padding-left: 2px; }
  .day-events { font-size: 10px; display: flex; flex-direction: column; gap: 1px; }
  .day-event-pill {
    color: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    line-height: 1.4;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill-exam   { background: #e74c3c; }
  .pill-event  { background: #95a5a6; }
  .pill-course { background: #3f9d5c; }

  /* ===== Events Sidebar ===== */
  .events-section {
    background: #f8f9fc;
    padding: 22px 20px;
    border-left: 1px solid #eef0f5;
    display: flex;
    flex-direction: column;
  }
  .events-section h2 {
    font-size: 15px;
    margin-bottom: 2px;
    color: #2c3e50;
    font-weight: 700;
  }
  .selected-date-label {
    font-size: 11px;
    color: #95a5a6;
    margin-bottom: 12px;
  }
  .jump-schedule-btn {
    display: none;
    margin-bottom: 12px;
    padding: 6px 10px;
    background: #5a6fd6;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
  }
  .jump-schedule-btn:hover { background: #4a5cc5; }
  .events-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
  .event-card {
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    border-left: 3px solid #5a6fd6;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .event-card.exam { border-left-color: #e74c3c; }
  .event-card.course { border-left-color: #2e7d32; }
  .event-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: #2c3e50; }
  .event-time { font-size: 11px; color: #7f8c8d; }
  .event-location { font-size: 11px; color: #5a6fd6; margin-top: 1px; }
  .event-actions {
    margin-top: 6px;
    display: flex;
    gap: 6px;
  }
  .event-actions button {
    background: #f0f2f8;
    border: none;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    color: #5a6fd6;
  }
  .event-actions button:hover { background: #e2e5f0; }
  .event-actions .delete-btn { background: #fde8e7; color: #e74c3c; }
  .event-actions .delete-btn:hover { background: #f8d4d2; }
  .empty-state {
    text-align: center;
    color: #b2bec3;
    padding: 24px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-state small { display: block; margin-top: 6px; font-size: 11px; }

  /* ===== Schedule View (HKU style) ===== */
  .schedule-section {
    padding: 20px 24px 24px;
    overflow-x: auto;
  }
  .schedule-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .schedule-title { font-size: 17px; font-weight: 700; color: #2c3e50; }
  .schedule-nav { display: flex; gap: 6px; align-items: center; }
  .schedule-nav .nav-btn { width: 32px; height: 32px; }
  .week-label { font-size: 12px; color: #7f8c8d; font-weight: 500; padding: 0 6px; }

  /* HKU-style timetable */
  .tt-grid {
    position: relative;
    display: grid;
    grid-template-columns: 70px repeat(7, 1fr);
    background: #e0e0e0;
    border-radius: 4px;
    overflow: visible;
    min-width: 780px;
    gap: 1px;
    border: 1px solid #d0d0d0;
  }
  /* 网格背景层（用于斑马纹） */
  .tt-bg {
    position: absolute;
    top: 48px;
    left: 70px;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 28px;
    gap: 1px;
    z-index: 0;
    pointer-events: none;
  }
  .tt-bg > div {
    background: #fafbfc;
  }
  .tt-bg > div:nth-child(even) {
    background: #f2f4f8;
  }
  /* 课表节假日底色 */
  .tt-bg .bg-holiday {
    background: linear-gradient(135deg, #ffeaea, #ffd6d6) !important;
  }
  .tt-bg .bg-exam {
    background: linear-gradient(135deg, #fef9e7, #fdebd0) !important;
  }
  .tt-bg .bg-independent {
    background: linear-gradient(135deg, #e8f8f5, #d1f2eb) !important;
  }
  .tt-bg .bg-makeup {
    background: linear-gradient(135deg, #f5eef8, #e8daef) !important;
  }
  /* 课表表头节假日标记 */
  .tt-header.holiday-col {
    background: linear-gradient(180deg, #fadbd8, #e8edf5) !important;
    color: #c0392b;
  }
  .tt-header.exam-col {
    background: linear-gradient(180deg, #fdebd0, #e8edf5) !important;
    color: #b7950b;
  }
  .tt-header.independent-col {
    background: linear-gradient(180deg, #d1f2eb, #e8edf5) !important;
    color: #16a085;
  }
  .tt-header.makeup-col {
    background: linear-gradient(180deg, #e8daef, #e8edf5) !important;
    color: #8e44ad;
  }
  .tt-header {
    background: #e8edf5;
    text-align: center;
    font-weight: 600;
    padding: 10px 4px;
    font-size: 12px;
    color: #3a4a6a;
    border-bottom: 2px solid #c5cdd8;
  }
  .tt-header.weekend { color: #c0392b; }
  .tt-header.today-col {
    background: linear-gradient(180deg, #d4e4ff, #e8edf5);
    color: #5a6fd6;
    font-weight: 700;
  }
  .tt-header-date {
    font-weight: 400;
    font-size: 10px;
    color: #7f8c8d;
    margin-top: 2px;
  }
  .tt-time-label {
    background: #f5f6fa;
    text-align: right;
    padding: 2px 8px 2px 0;
    font-size: 10.5px;
    color: #6c7a89;
    font-weight: 500;
  }
  .tt-course {
    position: absolute;
    background: #d4edda;
    border: 1px solid #82c98c;
    border-radius: 4px;
    padding: 5px 8px;
    color: #2d3d2f;
    font-size: 11px;
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow 0.15s, transform 0.15s;
    z-index: 2;
    box-sizing: border-box;
    touch-action: pan-y;   /* 允许纵向滚动；拖拽由长按激活后 JS 阻止 */
    -webkit-user-select: none;
    -webkit-touch-callout: none;   /* 防长按弹出系统菜单 */
    user-select: none;
  }
  .tt-course:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transform: scale(1.01);
    z-index: 10;
  }
  /* ===== 拖拽换位 ===== */
  .tt-course.dragging {
    transition: none;
    opacity: 0.92;
    z-index: 100;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    cursor: grabbing;
  }
  .tt-drop-target {
    outline: 2px dashed #5a6fd6;
    outline-offset: -2px;
    filter: brightness(0.96);
  }
  .tt-drag-hint {
    position: fixed;
    z-index: 10001;
    pointer-events: none;
    font-size: 12px;
    color: #fff;
    background: rgba(74,88,180,0.95);
    padding: 4px 12px;
    border-radius: 14px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transform: translate(-50%, -170%);
  }
  /* ===== 一键退课/加课 ===== */
  .schedule-tools { display: flex; gap: 6px; }
  .btn-tool {
    background: #fff;
    border: 1px solid #d5d9e2;
    color: #5a6fd6;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-tool:hover { background: #f0f2fa; border-color: #5a6fd6; }
  .btn-tool.danger { color: #e74c3c; }
  .btn-tool.danger:hover { background: #fdf0ef; border-color: #e74c3c; }
  /* 一键云同步按钮（渐变高亮款） */
  .btn-tool.cloud-sync {
    background: linear-gradient(135deg, #4a90d9, #36b5a0);
    border: none;
    color: #fff;
    box-shadow: 0 3px 10px rgba(74, 144, 217, 0.35);
  }
  .btn-tool.cloud-sync:hover { background: linear-gradient(135deg, #3d80c9, #2ea591); }
  .btn-tool.cloud-sync:active { transform: scale(0.95); }
  .btn-tool.cloud-sync.syncing { opacity: 0.75; pointer-events: none; }
  .btn-tool.cloud-sync.syncing .cs-ic { display: inline-block; animation: cloudFloat 0.9s ease-in-out infinite; }
  @keyframes cloudFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  /* 课表切换下拉 */
  .tt-select { flex: 0 1 130px; padding: 7px 8px; font-size: 12px; border: 1px solid #dfe2eb; border-radius: 8px; background: #fff; color: #2c3550; max-width: 130px; }
  .tt-select:focus { outline: none; border-color: #6a5acd; }
  /* 更多菜单（折叠式） */
  .more-menu-wrap { position: relative; display: inline-block; }
  .more-dropdown {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 200;
    background: #fff; border: 1px solid #e0e3ec; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15); min-width: 180px; padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .more-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
  .more-row label { font-size: 13px; color: #2c3550; white-space: nowrap; }
  .more-row .tt-select { flex: 1; min-width: 0; padding: 5px 6px; font-size: 13px; }
  .more-item {
    background: none; border: none; text-align: left; padding: 8px 10px;
    font-size: 14px; color: #2c3550; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .more-item:hover { background: #f0f2fa; }
  .more-item.danger { color: #e74c3c; }
  .more-item.danger:hover { background: #fdecea; }
  .more-sep { height: 1px; background: #e8eaf2; margin: 4px 0; }
  /* 校历设置弹窗 */
  .cal-settings-modal { max-width: 420px; }
  .cal-settings-modal .modal-body { max-height: 70vh; overflow-y: auto; }
  .cal-settings-modal h4 { margin: 0 0 8px; font-size: 14px; color: #2c3550; }
  .holiday-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .holiday-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e8eaf2; }
  .holiday-item .holiday-name { flex: 1; font-size: 13px; font-weight: 600; color: #2c3550; }
  .holiday-item .holiday-dates { font-size: 12px; color: #888; }
  .holiday-item .holiday-del { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; padding: 0 4px; }
  .holiday-form { display: flex; gap: 6px; flex-wrap: wrap; }
  .holiday-form input { flex: 1; min-width: 80px; padding: 7px 8px; font-size: 13px; border: 1px solid #dfe2eb; border-radius: 8px; }
  .holiday-form input:focus { outline: none; border-color: #6a5acd; }
  /* ===== 退课列表 ===== */
  .drop-list { max-height: 46vh; overflow-y: auto; }
  .drop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid #f0f0f5;
    cursor: pointer; transition: background 0.12s;
  }
  .drop-item:hover { background: #f8f9fc; }
  .drop-item:last-child { border-bottom: none; }
  .drop-checkbox {
    width: 20px; height: 20px; border: 2px solid #d5d9e2;
    border-radius: 5px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; transition: all 0.12s;
  }
  .drop-item.checked .drop-checkbox {
    background: #e74c3c; border-color: #e74c3c; color: #fff;
  }
  .drop-item.checked .drop-checkbox::after { content: '✓'; font-size: 13px; font-weight: 700; }
  .drop-info { flex: 1; min-width: 0; }
  .drop-name { font-size: 13px; font-weight: 600; color: #2c3e50; }
  .drop-meta { font-size: 11px; color: #95a5a6; margin-top: 1px; }
  /* ===== 课件文件 ===== */
  .file-list { max-height: 44vh; overflow-y: auto; }
  .file-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-bottom: 1px solid #f0f0f5;
    cursor: pointer; transition: background 0.12s;
  }
  .file-item:active { background: #f4f6fa; }
  .file-item:last-child { border-bottom: none; }
  .file-icon {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; color: #fff;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 13px; font-weight: 600; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 11px; color: #95a5a6; margin-top: 1px; }
  .file-del {
    width: 30px; height: 30px; border: none; border-radius: 7px;
    background: #fdecea; color: #e74c3c; font-size: 14px;
    flex-shrink: 0; cursor: pointer;
  }
  .file-del:active { background: #f9d2ce; }
  .file-empty { padding: 26px 12px; text-align: center; color: #b2bec3; font-size: 13px; line-height: 1.8; }
  .storage-info { margin-top: 10px; font-size: 11px; color: #95a5a6; text-align: center; }
  .btn-file-add {
    width: 100%; margin-top: 12px; padding: 12px;
    border: 2px dashed #b8c0cf; border-radius: 10px;
    background: #fafbfd; color: #5a6b85; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .btn-file-add:active { background: #f0f3f8; }
  /* 课表课程块上的附件角标 */
  .cc-file-badge {
    position: absolute; right: 3px; top: 2px;
    font-size: 9px; line-height: 1; pointer-events: none;
  }
  /* ===== 云同步条 ===== */
  .cloud-bar {
    margin-top: 12px; padding: 10px 12px;
    background: #f4f7ff; border: 1px solid #e3e9fb; border-radius: 10px;
  }
  .cloud-info { font-size: 11px; color: #5a6b85; line-height: 1.7; }
  .cloud-info.on { color: #2f7d4f; }
  .cloud-btns { display: flex; gap: 8px; margin-top: 8px; }
  .cloud-btn {
    flex: 1; padding: 9px 6px;
    border: none; border-radius: 8px;
    background: #e6ebfa; color: #3d4f9e;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .cloud-btn.warn { background: #fdecea; color: #c0392b; }
  .cloud-btn:active { filter: brightness(0.94); }
  /* ===== 密码锁 ===== */
  #lockOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(160deg, #4f8ef7, #6a4f9e);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #lockOverlay.hidden { display: none; }
  .lock-card {
    background: #fff; border-radius: 18px; padding: 28px 24px;
    width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .lock-logo { font-size: 40px; }
  .lock-title { font-size: 18px; font-weight: 700; color: #2c3550; margin-top: 8px; }
  .lock-sub { font-size: 12px; color: #8a93a8; margin: 6px 0 4px; line-height: 1.6; }
  .lock-input {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border: 1.5px solid #dfe3ee; border-radius: 10px;
    font-size: 16px; margin-top: 10px; text-align: center; letter-spacing: 2px;
  }
  .lock-input:focus { outline: none; border-color: #4f8ef7; background: #f8faff; }
  .lock-err { min-height: 18px; font-size: 12px; color: #e74c3c; margin-top: 8px; }
  .lock-btn {
    width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #4f8ef7, #6a4f9e); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(79, 142, 247, 0.35);
  }
  .lock-btn:active { transform: scale(0.97); }
  .lock-reset {
    background: none; border: none; margin-top: 14px;
    font-size: 11px; color: #b0b7c6; text-decoration: underline; cursor: pointer;
  }
  /* 账户登录/注册选项卡 */
  .auth-tabs { display: flex; gap: 6px; margin-top: 12px; background: #eef1f8; border-radius: 10px; padding: 4px; }
  .auth-tab { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: #6b7488; cursor: pointer; }
  .auth-tab.active { background: #fff; color: #2c3550; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
  /* 账户信息条（更新日志弹窗内） */
  .account-bar { text-align: center; font-size: 12px; color: #8a93a8; padding: 8px 0 2px; border-top: 1px solid #eef0f6; margin-top: 10px; }
  /* ===== 星期多选 chips ===== */
  .weekday-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .wd-chip {
    position: relative; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center;
    width: 38px; height: 34px; border: 2px solid #e0e3eb;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    color: #95a5a6; transition: all 0.12s; user-select: none;
  }
  .wd-chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .wd-chip:has(input:checked) {
    background: #5a6fd6; border-color: #5a6fd6; color: #fff;
  }
  .wd-chip:hover { border-color: #5a6fd6; }
  /* ===== Toast 提示 ===== */
  .app-toast {
    position: fixed; left: 50%; bottom: 40px;
    transform: translateX(-50%) translateY(16px);
    background: rgba(40,50,80,0.92); color: #fff;
    padding: 10px 22px; border-radius: 22px;
    font-size: 13px; z-index: 11000; opacity: 0;
    transition: all 0.3s; pointer-events: none;
    max-width: 82vw; text-align: center;
  }
  .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ===== 更新日志 ===== */
  .changelog-list { max-height: 52vh; overflow-y: auto; text-align: left; padding-right: 4px; }
  .cl-ver { margin-bottom: 14px; }
  .cl-ver:last-child { margin-bottom: 0; }
  .cl-ver-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cl-version { font-weight: 700; color: #4e5db0; font-size: 14px; }
  .cl-badge {
    font-size: 10px; background: #e8ebf8; color: #4e5db0;
    border-radius: 8px; padding: 1px 8px; font-weight: 600;
  }
  .cl-date { font-size: 11px; color: #95a5a6; margin-left: auto; }
  .cl-ver ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: #2c3e50; line-height: 1.9; }
  .tt-course .cc-code {
    font-weight: 700;
    font-size: 11.5px;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .tt-course .cc-type {
    font-size: 10px;
    color: #5a7a60;
    margin-bottom: 1px;
  }
  .tt-course .cc-time {
    font-size: 10px;
    color: #5a7a60;
    margin-bottom: 1px;
  }
  .tt-course .cc-loc {
    font-size: 10px;
    color: #3d5a45;
    font-weight: 500;
  }
  .tt-course.exam {
    background: #fadbd8;
    border-color: #ec7063;
    color: #7b241c;
  }
  .tt-course.exam .cc-type,
  .tt-course.exam .cc-time { color: #a93226; }
  .tt-course.event {
    background: #e8daef;
    border-color: #bb8fce;
    color: #4a235a;
  }
  .tt-course.event .cc-type,
  .tt-course.event .cc-time { color: #7d3c98; }

  .tt-legend {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
    background: #f8f9fc;
    border-radius: 8px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #7f8c8d; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(30, 30, 60, 0.45);
    z-index: 100;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.15s ease;
  }
  .modal-overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 92%;
    max-width: 400px;
    animation: slideUp 0.2s ease;
    box-shadow: 0 16px 50px rgba(0,0,0,0.18);
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; color: #2c3e50; font-weight: 700; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
    color: #7f8c8d;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e4e8f0;
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fafbfc;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: #5a6fd6;
    box-shadow: 0 0 0 3px rgba(90,111,214,0.12);
    background: #fff;
  }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .reminder-status {
    margin-top: 12px;
    padding: 8px 12px;
    background: #f0f2f8;
    border-radius: 7px;
    font-size: 11px;
    color: #7f8c8d;
    text-align: center;
  }
  .reminder-status.enabled { background: #e8f5e9; color: #2e7d32; }

  /* ===== 课程操作弹出菜单 ===== */
  .popup-menu {
    position: fixed;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    padding: 6px;
    min-width: 160px;
    z-index: 200;
    animation: popIn 0.12s ease;
    border: 1px solid #eef0f5;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .popup-menu .pm-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: #2c3e50;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .popup-menu .pm-item:hover { background: #f0f2f8; }
  .popup-menu .pm-item.danger { color: #e74c3c; }
  .popup-menu .pm-item.danger:hover { background: #fde8e7; }
  .popup-menu .pm-divider {
    height: 1px;
    background: #eef0f5;
    margin: 4px 6px;
  }
  .popup-menu .pm-item .pm-icon { font-size: 14px; width: 16px; text-align: center; }
  .popup-menu .pm-hint {
    font-size: 11px;
    color: #95a5a6;
    padding: 4px 12px 8px;
  }

  /* 课程块有 url 时显示小链接图标 */
  .tt-course.has-url::after {
    content: '🔗';
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
  }

  /* ===== 开屏动画 ===== */
  .splash-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #4f2e7e 0%, #6a4f9e 50%, #8e44ad 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease;
  }
  .splash-screen.hide {
    opacity: 0;
    pointer-events: none;
  }
  .splash-content {
    text-align: center;
    animation: splashFadeIn 0.8s ease;
    padding: 20px;
  }
  .splash-crest {
    width: 180px;
    height: 180px;
    border-radius: 28px;
    object-fit: cover;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.2);
    animation: crestPop 0.7s cubic-bezier(0.2,1.2,0.4,1);
  }
  .splash-title {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin: 24px 0 6px;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .splash-sub {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    margin-bottom: 0;
    letter-spacing: 0.5px;
  }
  @keyframes splashFadeIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes crestPop {
    0% { opacity: 0; transform: scale(0.6) rotate(-6deg); }
    60% { transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @media (max-width: 480px) {
    .splash-crest { width: 140px; height: 140px; border-radius: 22px; }
    .splash-title { font-size: 20px; margin-top: 18px; }
    .splash-sub { font-size: 12px; }
  }

  /* ================================================================
     手机端布局（无条件覆盖，放在最后确保优先级）
     目标屏幕 CSS 像素约 400×870（2608×1200 物理 / 3x）
  ================================================================ */
  .main { grid-template-columns: 1fr; min-height: 0; }
  header { padding: 12px 14px; flex-wrap: nowrap; gap: 8px; }
  header h1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { gap: 6px; flex-shrink: 0; }
  .btn { padding: 8px 14px; font-size: 13px; }
  .view-tabs { padding: 0 10px; }
  .view-tab { font-size: 13px; padding: 9px 18px; }
  .calendar-section { padding: 12px 10px 16px; }
  .schedule-section { padding: 12px 10px 16px; }
  .calendar-title { font-size: 16px; }
  .calendar-header { margin-bottom: 12px; }
  .nav-btn { width: 34px; height: 34px; font-size: 16px; }
  .schedule-header { gap: 6px; }
  .schedule-tools { order: 3; width: 100%; }
  .btn-tool { flex: 1; padding: 8px 10px; font-size: 12px; text-align: center; }
  .weekdays { gap: 3px; margin-bottom: 4px; }
  .weekday { font-size: 12px; padding: 5px 0; }
  .days { gap: 3px; }
  .day { min-height: 56px; padding: 3px 4px; border-radius: 6px; }
  .day-number { font-size: 13px; font-weight: 600; }
  .day-week-tag { font-size: 8px; padding: 0 3px; top: 2px; right: 2px; line-height: 1.4; }
  .day-holiday-label { display: none; }
  .day-event-pill { display: none; }
  .day.has-events::after { bottom: 4px; right: 4px; }
  .events-section { padding: 12px 14px; border-left: none; border-top: 1px solid #eef0f5; }
  .events-section h2 { font-size: 15px; }
  .events-list { max-height: 38vh; }
  .jump-schedule-btn { display: block; margin-bottom: 12px; padding: 9px 10px; font-size: 13px; border-radius: 8px; }
  .event-card { padding: 12px; }
  .event-title { font-size: 14px; }
  .event-actions button { padding: 6px 10px; font-size: 12px; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .schedule-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tt-grid { min-width: 760px; }
  /* 移动端弹窗：全宽底部弹出，便于手指操作 */
  .modal-overlay { align-items: flex-end; background: rgba(0,0,0,0.5); }
  .modal { width: 100%; max-width: 100%; max-height: 92vh; margin: 0; border-radius: 16px 16px 0 0; padding: 18px 16px; overflow-y: auto; }
  .modal h3 { font-size: 18px; margin-bottom: 14px; }
  .form-row { flex-direction: column; gap: 0; }
  .form-group input, .form-group select { padding: 12px 12px; font-size: 16px; }
  .form-group label { font-size: 13px; }
  .modal-actions { margin-top: 18px; }
  .modal-actions .btn { padding: 11px 18px; font-size: 15px; flex: 1; }
  .popup-menu { font-size: 14px; }
  .popup-menu button { padding: 12px 16px; }
</style>
</head>
<body>
<!-- 密码锁（首次设置 / 每次新会话解锁） -->
<div id="lockOverlay" class="hidden"></div>
<!-- 开屏动画 -->
<div id="splashScreen" class="splash-screen">
  <div class="splash-content">
    <img src="./crest.png" alt="校徽" class="splash-crest">
    <h1 class="splash-title">我的日历 & 课表</h1>
    <p class="splash-sub">CUHK-Shenzhen 2026-27</p>
  </div>
</div>
<div class="container">
  <header>
    <h1>📅 我的日历 & 课表</h1>
    <div class="header-actions" style="flex-wrap:wrap;">
      <button class="btn" id="todayBtn">今天</button>
      <button class="btn" id="refreshPageBtn">🔄 刷新</button>
      <button class="btn" id="changelogBtn">📜 日志</button>
      <button class="btn" id="msgBoardTopBtn" style="display:none; position:relative;">💬 留言<span id="msgTopBadge" style="display:none; position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px; background:#e74c3c; color:#fff; font-size:11px; font-weight:700; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 1px 4px rgba(0,0,0,0.25);">0</span></button>
      <button class="btn btn-primary" id="addBtn">+ 新增</button>
    </div>
  </header>

  <div class="view-tabs">
    <button class="view-tab active" data-view="calendar">🗓 日历</button>
    <button class="view-tab" data-view="schedule">📚 课表</button>
  </div>

  <!-- ===== CALENDAR VIEW ===== -->
  <div class="main" id="calendarView">
    <div class="calendar-section">
      <div class="calendar-header">
        <div class="calendar-title" id="calendarTitle">2026年9月</div>
        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn">‹</button>
          <button class="nav-btn" id="nextBtn">›</button>
        </div>
      </div>
      <div class="weekdays">
        <div class="weekday weekend">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday weekend">六</div>
      </div>
      <div class="days" id="daysGrid"></div>
    </div>

    <div class="events-section">
      <h2>📋 当日事项</h2>
      <div class="selected-date-label" id="selectedDateLabel"></div>
      <button class="jump-schedule-btn" id="jumpScheduleBtn">📚 查看本周课表 →</button>
      <div class="events-list" id="eventsList"></div>
    </div>
  </div>

  <!-- ===== SCHEDULE VIEW (HKU style) ===== -->
  <div id="scheduleView" class="hidden">
    <div class="schedule-section">
      <div class="schedule-header">
        <div class="schedule-title">📚 每周课程表</div>
        <div class="schedule-tools">
          <button class="btn-tool danger" id="clearCoursesBtn">🗑 退课</button>
          <button class="btn-tool" id="restoreCoursesBtn">➕ 加课</button>
          <button class="btn-tool cloud-sync" id="cloudSyncBtn"><span class="cs-ic">☁️</span> 云同步</button>
          <button class="btn-tool" id="undoBtn" style="display:none;">↩ 撤销</button>
          <div class="more-menu-wrap" id="moreMenuWrap">
            <button class="btn-tool" id="moreMenuBtn">☰ 更多 ▾</button>
            <div class="more-dropdown" id="moreDropdown" style="display:none;">
              <div class="more-row" id="moreTTRow" style="display:none;">
                <label>📚 课表：</label>
                <select class="tt-select" id="ttSelect"></select>
              </div>
              <button class="more-item" id="ttNewBtn" style="display:none;">➕ 新建课表</button>
              <button class="more-item" id="ttRenameBtn" style="display:none;">✏️ 重命名课表</button>
              <button class="more-item danger" id="ttDeleteBtn" style="display:none;">🗑 删除课表</button>
              <div class="more-sep"></div>
              <button class="more-item" id="calSettingsBtn" style="display:none;">📅 校历设置</button>
              <button class="more-item" id="tutorialBtn">❓ 使用教程</button>
              <button class="more-item" id="msgBoardBtn" style="display:none;">💬 留言板</button>
              <div class="more-sep"></div>
              <button class="more-item danger" id="logoutBtn2" style="display:none;">⏻ 退出登录</button>
            </div>
          </div>
        </div>
        <div class="schedule-nav">
          <button class="nav-btn" id="schPrevBtn">‹</button>
          <span class="week-label" id="weekLabel"></span>
          <button class="nav-btn" id="schNextBtn">›</button>
        </div>
      </div>
      <div class="tt-grid" id="ttGrid"></div>
      <div class="tt-legend" id="ttLegend"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">新增事项</h3>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="eventTitle" placeholder="例如：CSC 1001-L02 / CSC考试">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>类型</label>
        <select id="eventType">
          <option value="course">课程（每周重复）</option>
          <option value="exam">考试</option>
          <option value="event">普通事项</option>
        </select>
      </div>
      <div class="form-group" id="weekdayGroup">
        <label>星期</label>
        <select id="eventWeekday">
          <option value="1">周一</option>
          <option value="2">周二</option>
          <option value="3">周三</option>
          <option value="4">周四</option>
          <option value="5">周五</option>
          <option value="6">周六</option>
          <option value="0">周日</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="dateGroup">
      <label>日期</label>
      <input type="date" id="eventDate">
    </div>

];

// 补课日（这天按星期五的课表上课）
let MAKEUP_DAYS = [
  { date: '2026-09-20', weekdayAs: 5, name: '补课(周五)' }
];

// 默认校历（用于新用户初始化和重置）
const DEFAULT_CALENDAR = {
  semesters: JSON.parse(JSON.stringify(SEMESTERS)),
  examPeriods: JSON.parse(JSON.stringify(EXAM_PERIODS)),
  holidays: JSON.parse(JSON.stringify(HOLIDAYS)),
  makeupDays: JSON.parse(JSON.stringify(MAKEUP_DAYS))
};

/* ================================================================
   校历辅助函数
================================================================ */
function dkToDate(dk) { return new Date(dk + 'T00:00:00'); }

// 判断某天是否在某个范围
function inRange(dk, start, end) { return dk >= start && dk <= end; }

// 获取日期完整信息
function getDateInfo(d) {
  const dk = dateKey(d);
  const info = { semester: null, week: null, holiday: null, makeup: null, exam: false, independent: false };

  // 学期 & 周次
  for (const s of SEMESTERS) {
    if (dk >= s.start && dk <= s.end) {
      info.semester = s.name;
      if (s.type === 'independent') {
        info.independent = true;
      } else {
        // 计算第几周（以周一为周首）
        const startDate = dkToDate(s.start);
        // 如果学期开始不是周一，回溯到该周的周一
        const startDay = startDate.getDay();
        const diffToMon = startDay === 0 ? -6 : 1 - startDay;
        const week1Monday = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + diffToMon);
        const dMonday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
        const weeksDiff = Math.round((dMonday - week1Monday) / (7 * 86400000));
        info.week = weeksDiff + 1;
      }
      break;
    }
  }

  // 考试期
  for (const ep of EXAM_PERIODS) {
    if (dk >= ep.start && dk <= ep.end) {
      info.exam = true;
      if (!info.semester) info.semester = ep.name;
      break;
    }
  }

  // 节假日
  for (const h of HOLIDAYS) {
    if (dk >= h.start && dk <= h.end) { info.holiday = h.name; break; }
  }

  // 补课
  for (const m of MAKEUP_DAYS) {
    if (dk === m.date) { info.makeup = m; break; }
  }

  return info;
}

// 判断某天是否有课（非假期、非考试期、非独立探索期）
function hasSchool(d) {
  const info = getDateInfo(d);
  if (info.holiday) return false;
  if (info.exam) return false;
  if (info.independent) return false;
  return true;
}

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeToMinutes(t) { const [h,m] = t.split(':').map(Number); return h*60 + m; }
function formatRemind(min) {
  if (min < 60) return `${min}分钟`;
  if (min < 1440) return `${min/60}小时`;
  return `${min/1440}天`;
}

function loadData() {

    }

    events = [];

}

/* ================================================================
   课件文件（IndexedDB 本地存储，按课程关联）
================================================================ */
const FILE_DB = 'calendar_files_v1';
const FILE_STORE = 'files';

function openFileDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FILE_DB, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(FILE_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function fileDb(mode, fn) {
  const db = await openFileDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FILE_STORE, mode);
    const req = fn(tx.objectStore(FILE_STORE));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
const dbAddFiles = (records) => fileDb('readwrite', st => {
  records.forEach(r => st.put(r));
});
const dbGetAllFiles = () => fileDb('readonly', st => st.getAll());
const dbDeleteFile = (id) => fileDb('readwrite', st => st.delete(id));

// 课件按"课程 section"关联：同一 section 的所有周次时间段共享课件
// key = 课程名去空格/连字符并转大写，如 'CSC 1001-L02' → 'CSC1001L02'
// CSC1001-L02 与 CSC1001-T04 名字不同 → 不会互相混淆
function courseKey(c) {
  return ((c && c.name) || '').toUpperCase().replace(/[\s\-_（）()]/g, '');
}
// 兼容旧记录：无 fileKey 时用 courseId 反查课程名
function fileRecordKey(f) {
  if (f.fileKey) return f.fileKey;
  const c = courses.find(x => x.id === f.courseId);
  return c ? courseKey(c) : '';
}

/* ================================================================
   云端跨设备同步（GitHub 仓库作为存储，免费）
   - cloud-files/{id}  文件二进制；cloud-files/manifest.json  清单
   - 配置 Token 的设备：上传/删除（Contents 读写权限）
   - 其他设备：从 raw.githubusercontent.com 免登录自动下载
================================================================ */
const CLOUD_REPO = 'deliciouskfc/calendar-reminder';
const CLOUD_DIR = 'cloud-files';
const GH_TOKEN_KEY = 'calendar_gh_token';
let cloudManifest = null;
let cloudSyncing = false;

function ghToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function ghHeaders(tok) { return { 'Authorization': 'Bearer ' + (tok || ghToken()), 'Accept': 'application/vnd.github+json' }; }
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function fetchCloudManifest() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${CLOUD_REPO}/main/${CLOUD_DIR}/manifest.json?t=` + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}
async function ensureCloudManifest() {
  if (!cloudManifest) cloudManifest = await fetchCloudManifest() || { files: [] };
  return cloudManifest;
}
async function writeCloudManifest(entries) {
  const url = `https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_DIR}/manifest.json`;
  const res0 = await fetch(url, { headers: ghHeaders() });
  let sha = null;
  if (res0.ok) sha = (await res0.json()).sha;
  const bytes = new TextEncoder().encode(JSON.stringify({ files: entries }));
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  const body = { message: 'chore: update cloud manifest', branch: 'main', content: btoa(bin) };
  if (sha) body.sha = sha;
  const res = await fetch(url, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('写清单失败 ' + res.status);
}
async function putCloudFile(id, b64) {
  const res = await fetch(`https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_DIR}/${id}`, {
    method: 'PUT',
    headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'chore: upload courseware ' + id, branch: 'main', content: b64 })
  });
  if (!res.ok) throw new Error('上传失败 ' + res.status);
}
async function deleteCloudFile(id) {
  const url = `https://api.github.com/repos/${CLOUD_REPO}/contents/${CLOUD_DIR}/${id}`;
  const res0 = await fetch(url, { headers: ghHeaders() });
  if (res0.status === 404) return;
  if (!res0.ok) throw new Error('删除失败 ' + res0.status);
  const j = await res0.json();
  const res = await fetch(url, {
    method: 'DELETE',
    headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'chore: delete courseware ' + id, branch: 'main', sha: j.sha })
  });
  if (!res.ok) throw new Error('删除失败 ' + res.status);
}
// 把本地未上云的文件全部上传（返回 {uploaded}；toast 由调用方处理）
async function uploadPendingToCloud() {
  if (!ghToken() || cloudSyncing) return { uploaded: 0 };
  const files = await dbGetAllFiles();
  const mf = await ensureCloudManifest();
  const known = new Set((mf.files || []).map(f => f.id));
  const pending = files.filter(f => !known.has(f.id));
  if (!pending.length) return { uploaded: 0 };
  cloudSyncing = true;
  try {
    for (const f of pending) {
      await putCloudFile(f.id, await blobToBase64(f.blob));
      mf.files.push({ id: f.id, fileKey: fileRecordKey(f), name: f.name, type: f.type, size: f.size, uploadedAt: Date.now() });
    }
    await writeCloudManifest(mf.files);
    return { uploaded: pending.length };
  } finally { cloudSyncing = false; }
}
// 从云端下载本机没有的文件（无需 Token）
async function syncFromCloud() {
  if (cloudSyncing) return { downloaded: 0, total: 0 };
  cloudSyncing = true;
  try {
    const mf = await fetchCloudManifest();
    cloudManifest = mf;
    if (!mf || !Array.isArray(mf.files)) return { downloaded: 0, total: 0 };
    const local = await dbGetAllFiles();
    const have = new Set(local.map(f => f.id));
    const missing = mf.files.filter(f => !have.has(f.id));
    if (!missing.length) return { downloaded: 0, total: mf.files.length };
    let ok = 0;
    for (const m of missing) {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${CLOUD_REPO}/main/${CLOUD_DIR}/${m.id}?t=` + Date.now(), { cache: 'no-store' });
        if (!res.ok) continue;
        const blob = await res.blob();
        await dbAddFiles([{
          id: m.id, courseId: '', fileKey: m.fileKey || '',
          name: m.name, type: m.type || '', size: m.size,
          blob, addedAt: m.uploadedAt || Date.now(), cloud: true
        }]);
        ok++;
      } catch (e) { /* 单个失败跳过 */ }
    }
    if (ok) { attachCountsDirty = true; renderSchedule(); if (fileSheetCourse) await renderFileList(); }
    return { downloaded: ok, total: mf.files.length };
  } finally { cloudSyncing = false; }
}
// 主界面一键云同步：先上传本机新增（需 Token），再下载云端缺失
let cloudSyncAllBusy = false;
async function cloudSyncAll() {
  if (cloudSyncAllBusy) return;
  cloudSyncAllBusy = true;
  const btn = document.getElementById('cloudSyncBtn');
  if (btn) btn.classList.add('syncing');
  try {
    let uploaded = 0;
    if (ghToken()) uploaded = (await uploadPendingToCloud()).uploaded;
    const r = await syncFromCloud();
    const parts = [];
    if (uploaded) parts.push(`上传 ${uploaded} 个`);
    if (r.downloaded) parts.push(`下载 ${r.downloaded} 个`);
    if (parts.length) showToast('✅ 云同步完成：' + parts.join('，'));
    else if (!ghToken() && !r.total) showToast('☁️ 云端暂无课件（在课件面板可连接 GitHub 上传）');
    else showToast('✅ 课件已是最新');
  } catch (e) {
    showToast('⚠️ 同步失败：' + (e.message || '请检查网络'));
  } finally {
    cloudSyncAllBusy = false;
    if (btn) btn.classList.remove('syncing');
  }
}

// 连接 / 断开 GitHub Token
async function connectCloud() {
  const t = prompt('粘贴 GitHub Token（对 calendar-reminder 仓库有 Contents 读写权限）：\n\n生成方法：GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token → 仓库选 calendar-reminder → Permissions 里 Contents 选 Read and write');
  if (t === null) return;
  if (!t.trim()) { localStorage.removeItem(GH_TOKEN_KEY); showToast('已断开云同步'); renderCloudBar(); return; }
  try {
    const res = await fetch(`https://api.github.com/repos/${CLOUD_REPO}`, { headers: ghHeaders(t.trim()) });
    if (!res.ok) {
      showToast(res.status === 401 ? '❌ Token 无效' : (res.status === 403 ? '❌ Token 无仓库 Contents 权限' : '❌ 验证失败（' + res.status + '）'));
      return;
    }
    localStorage.setItem(GH_TOKEN_KEY, t.trim());
    showToast('✅ 已连接云同步');
    renderCloudBar();
    uploadPendingToCloud()
      .then(r => { if (r.uploaded) showToast(`✅ 已上传 ${r.uploaded} 个文件到云端`); })
      .catch(e => showToast('⚠️ ' + e.message));
  } catch (e) { showToast('⚠️ 验证失败，请检查网络'); }
}
function renderCloudBar() {
  const bar = document.getElementById('cloudBar');
  if (!bar) return;
  if (ghToken()) {
    bar.innerHTML = `
      <div class="cloud-info on">☁️ 已连接 GitHub · 添加的课件自动上传，其他设备打开本页自动下载</div>
      <div class="cloud-btns">
        <button class="cloud-btn" data-act="sync">⬇️ 立即同步</button>
        <button class="cloud-btn warn" data-act="disconnect">断开</button>
      </div>`;
  } else {
    bar.innerHTML = `
      <div class="cloud-info">☁️ 跨设备同步未开启 · 连接后在任意设备添加的课件，手机 / iPad 自动同步</div>
      <div class="cloud-btns">
        <button class="cloud-btn" data-act="connect">连接 GitHub</button>
        <button class="cloud-btn" data-act="sync">⬇️ 同步</button>
      </div>`;
  }
  bar.querySelectorAll('.cloud-btn').forEach(b => b.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const act = ev.currentTarget.dataset.act;
    if (act === 'connect') { connectCloud(); return; }
    if (act === 'disconnect') { localStorage.removeItem(GH_TOKEN_KEY); showToast('已断开云同步'); renderCloudBar(); return; }
    if (act === 'sync') {
      showToast('☁️ 正在同步…');
      try {
        const r = await syncFromCloud();
        showToast(r.downloaded ? `⬇️ 已下载 ${r.downloaded} 个课件` : (r.total ? '✅ 云端课件已最新' : '☁️ 云端暂无课件'));
        if (fileSheetCourse) await renderFileList();
      } catch (e) { showToast('⚠️ 同步失败，请检查网络'); }
    }
  }));
}

// 删除课程后清理其附件（saveData 时自动执行；云端下载的文件不清理，以免与云端反复拉扯）
async function pruneOrphanFiles() {
  try {
    const keys = new Set(courses.map(courseKey));
    const files = await dbGetAllFiles();
    const dead = files.filter(f => !f.cloud && !keys.has(fileRecordKey(f)));
    for (const f of dead) await dbDeleteFile(f.id);
    if (dead.length) attachCountsDirty = true;
  } catch (e) { /* IndexedDB 不可用时忽略 */ }
}

function formatSize(n) {
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}
function fileIconMeta(name, type) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return { label: 'PDF', color: '#e74c3c' };
  if (['ppt', 'pptx'].includes(ext)) return { label: 'PPT', color: '#e67e22' };
  if (['doc', 'docx', 'txt', 'md'].includes(ext)) return { label: 'DOC', color: '#2980b9' };
  if (['xls', 'xlsx', 'csv'].includes(ext)) return { label: 'XLS', color: '#27ae60' };
  if (['zip', 'rar', '7z'].includes(ext)) return { label: 'ZIP', color: '#8e44ad' };
  if (type.startsWith('image/')) return { label: 'IMG', color: '#16a085' };
  if (type.startsWith('audio/')) return { label: 'AUD', color: '#d35400' };
  if (type.startsWith('video/')) return { label: 'VID', color: '#c0392b' };
  return { label: 'FILE', color: '#7f8c8d' };
}

/* ---------- 课件管理弹窗 ---------- */
let fileSheetCourse = null;   // 当前弹窗对应的课程

async function openFileSheet(course) {
  fileSheetCourse = course;
  document.getElementById('fileSheetTitle').textContent = `📎 课件文件 — ${course.name}`;
  document.getElementById('fileOverlay').classList.add('active');
  await renderFileList();
  // 申请持久化存储空间（浏览器提供配额内权限，防清理）
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
}

async function renderFileList() {
  const listEl = document.getElementById('fileList');
  const infoEl = document.getElementById('storageInfo');
  const files = await dbGetAllFiles();
  const key = courseKey(fileSheetCourse);
  const mine = files.filter(f => fileRecordKey(f) === key)
                    .sort((a, b) => b.addedAt - a.addedAt);

  if (mine.length === 0) {
    listEl.innerHTML = `<div class="file-empty">还没有课件文件<br>点击下方按钮从手机里选择（PDF / PPT / DOC / 图片等）</div>`;
  } else {
    listEl.innerHTML = mine.map(f => {
      const m = fileIconMeta(f.name, f.type);
      return `
      <div class="file-item" data-fid="${f.id}">
        <div class="file-icon" style="background:${m.color}">${m.label}</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${formatSize(f.size)} · ${new Date(f.addedAt).toLocaleDateString('zh-CN')}</div>
        </div>
        <button class="file-del" data-del="${f.id}">✕</button>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', (ev) => {
        if (ev.target.closest('.file-del')) return;
        const rec = mine.find(x => x.id === el.dataset.fid);
        if (rec) openFileBlob(rec);
      });
    });
    listEl.querySelectorAll('.file-del').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        if (!confirm('删除该课件文件？（已上云的会在所有设备删除）')) return;
        await dbDeleteFile(btn.dataset.del);
        attachCountsDirty = true;
        renderSchedule();
        await renderFileList();
        // 云端同步删除
        if (ghToken()) {
          try {
            await deleteCloudFile(btn.dataset.del);
            const mf = await ensureCloudManifest();
            mf.files = (mf.files || []).filter(x => x.id !== btn.dataset.del);
            await writeCloudManifest(mf.files);
          } catch (e) { showToast('⚠️ 云端删除失败：' + e.message); }
        } else if (cloudManifest && (cloudManifest.files || []).some(x => x.id === btn.dataset.del)) {
          showToast('⚠️ 已从本机删除（未连接云端，其他设备仍会同步此文件）');
        }
      });
    });
  }

  if (navigator.storage && navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    infoEl.textContent = `本应用已用 ${formatSize(est.usage || 0)} · 剩余约 ${formatSize((est.quota || 0) - (est.usage || 0))}`;
  } else {
    infoEl.textContent = '';
  }
  renderCloudBar();
}

function openFileBlob(rec) {
  const url = URL.createObjectURL(rec.blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

  });
  if (attachCountsDirty) {
    try {
      const files = await dbGetAllFiles();
      window._attachCounts = files.reduce((m, f) => {
        const k = fileRecordKey(f);
        if (k) m[k] = (m[k] || 0) + 1;
        return m;
      }, {});
      attachCountsDirty = false;
    } catch (e) { window._attachCounts = {}; }
  }
  const counts = window._attachCounts || {};
  document.querySelectorAll('.tt-course').forEach(el => {
    const c = el._course;
    const n = c ? (counts[courseKey(c)] || 0) : 0;
    if (n > 0) {
      const b = document.createElement('span');
      b.className = 'cc-file-badge';
      b.textContent = '📄' + n;
      el.appendChild(b);
    }
  });
}

/* ================================================================
   日历渲染（只显示非课程事件）
================================================================ */
function renderCalendar() {
  const year = currentView.getFullYear();
  const month = currentView.getMonth();
  document.getElementById('calendarTitle').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysPrevMonth = new Date(year, month, 0).getDate();

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  for (let i = startWeekday - 1; i >= 0; i--) {
    const d = daysPrevMonth - i;
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${d}</div>`;
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = dateKey(date);
    const isPast = key < TODAY_KEY;
    const isToday = key === TODAY_KEY;
    const isSelected = selectedDate && key === dateKey(selectedDate);
    const info = getDateInfo(date);

    const cell = document.createElement('div');
    cell.className = 'day';
    if (isPast) cell.classList.add('past');
    if (isToday) cell.classList.add('today');
    if (isSelected) cell.classList.add('selected');

    // 特殊周底色（优先级：假期 > 考试 > 独立 > 补课）
    if (info.holiday) cell.classList.add('holiday');
    else if (info.exam) cell.classList.add('exam');
    else if (info.independent) cell.classList.add('independent');
    if (info.makeup) cell.classList.add('makeup');

    // 事件 pills（日历只显示考试和事件，不显示课程）
    let pillsHtml = '';
    if (!isPast) {
      const dayEvents = events.filter(e => e.date === key);

      if (dayEvents.length > 0) cell.classList.add('has-events');
      dayEvents.slice(0, 3).forEach(e => {
        const cls = e.type === 'exam' ? 'pill-exam' : 'pill-event';
        const label = e.type === 'exam' ? '考试' : (e.title.length > 4 ? e.title.slice(0,4) : e.title);
        pillsHtml += `<div class="day-event-pill ${cls}">${escapeHtml(label)}</div>`;
      });
      if (dayEvents.length > 3) {
        pillsHtml += `<div class="day-event-pill pill-event">+${dayEvents.length - 3}</div>`;
      }
    }

    // 周次标签（学期内且有周次）
    const weekTag = (info.week && !isPast) ? `<div class="day-week-tag">W${info.week}</div>` : '';
    // 节假日/补课标签
    const holidayLabel = info.holiday ? `<div class="day-holiday-label">${escapeHtml(info.holiday)}</div>` :
                         info.makeup ? `<div class="day-holiday-label" style="color:#8e44ad;">补课</div>` : '';

    cell.innerHTML = `${weekTag}<div class="day-number">${d}</div><div class="day-events">${pillsHtml}</div>${holidayLabel}`;
    if (!isPast) {
      cell.onclick = () => {
        selectedDate = date;
        renderCalendar();
        renderEventsList();
        renderSchedule();
      };
    }
    grid.appendChild(cell);
  }

  const totalCells = startWeekday + daysInMonth;
  const tail = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= tail; i++) {
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${i}</div>`;
    grid.appendChild(cell);
  }
}

function renderEventsList() {
  const list = document.getElementById('eventsList');
  const label = document.getElementById('selectedDateLabel');

  if (!selectedDate) {
    label.textContent = '';
    jumpBtn.style.display = 'none';
    list.innerHTML = '<div class="empty-state">👆 点击日历上的日期查看详情</div>';
    return;
  }

  const key = dateKey(selectedDate);
  const weekdayNames = ['日','一','二','三','四','五','六'];
  const info = getDateInfo(selectedDate);
  let labelText = `${selectedDate.getFullYear()}/${selectedDate.getMonth()+1}/${selectedDate.getDate()} · 周${weekdayNames[selectedDate.getDay()]}`;

  // 附加校历信息
  if (info.semester) {
    labelText += ` · ${info.semester}`;
    if (info.week) labelText += ` 第${info.week}周`;
  } else if (info.exam) {
    labelText += ` · 考试期`;
  }

  if (info.makeup) labelText += ` · 🔄 ${info.makeup.name}`;

  label.textContent = labelText;

  // 根据日期计算该上什么课（考虑假期/考试/补课）
  const weekday = selectedDate.getDay();

  // 补课时，用补的星期查课
  const effectiveWeekday = (info.makeup && info.makeup.weekdayAs) ? info.makeup.weekdayAs : weekday;
  let dayCourses = courses.filter(c => c.weekday === effectiveWeekday);

  // 假期/考试期/独立探索期 → 不上课（除非是补课日）
  if (!hasSchool(selectedDate) && !info.makeup) {
    dayCourses = [];
  }

  jumpBtn.style.display = dayCourses.length > 0 ? 'block' : 'none';

  const dayEvents = events.filter(e => e.date === key);

  // 过去日期
  if (key < TODAY_KEY) {
    list.innerHTML = '<div class="empty-state">📌 此日期已过</div>';
    return;
  }

  // 特殊日期提示
  let specialHint = '';
  if (info.holiday) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">🏖</span> 公众假期「${info.holiday}」，不上课</div>`;
  else if (info.exam) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">📝</span> 考试期，不上课</div>`;
  else if (info.independent) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">🔬</span> 独立探索期，不上课</div>`;
  if (info.makeup) {
    specialHint = `<div class="empty-state" style="padding:10px;background:#f5eef8;"><span style="font-size:16px;">🔄</span> 补课日：今日按「周五」课表上课</div>`;
  }

  if (dayCourses.length === 0 && dayEvents.length === 0) {
    list.innerHTML = specialHint || '<div class="empty-state">🍃 今日无事项</div>';
    return;
  }

  let html = specialHint || '';
  // 课程
  dayCourses.sort((a,b) => a.start.localeCompare(b.start));
  dayCourses.forEach(c => {
    html += `
      <div class="event-card course">
        <div class="event-title">📘 ${escapeHtml(c.name)}</div>
        <div class="event-time">⏰ ${c.start} - ${c.end} · ${escapeHtml(c.type || 'Lecture')}</div>
        ${c.location ? `<div class="event-location">📍 ${escapeHtml(c.location)}</div>` : ''}
        <div class="event-actions">
          <button onclick="editCourse('${c.id}')">编辑</button>
          <button class="delete-btn" onclick="deleteCourse('${c.id}')">删除</button>
        </div>
      </div>`;
  });
  // 事件
  dayEvents.sort((a,b) => a.start.localeCompare(b.start));
  dayEvents.forEach(e => {
    html += `
      <div class="event-card ${e.type === 'exam' ? 'exam' : ''}">
        <div class="event-title">${e.type === 'exam' ? '📕 ' : '📌 '}${escapeHtml(e.title)}</div>
        <div class="event-time">⏰ ${e.start} - ${e.end}${e.remind > 0 ? ` · 提前${formatRemind(e.remind)}提醒` : ''}</div>
        ${e.location ? `<div class="event-location">📍 ${escapeHtml(e.location)}</div>` : ''}
        <div class="event-actions">
          <button onclick="editEvent('${e.id}')">编辑</button>
          <button class="delete-btn" onclick="deleteEvent('${e.id}')">删除</button>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

/* ================================================================
   HKU 风格周课表
================================================================ */
// 从 08:00 到 22:00，每 30 分钟一行
const TT_START_MIN = 8 * 60;   // 480
const TT_END_MIN = 22 * 60;    // 1320
const TT_SLOT_MIN = 30;
const TT_ROW_COUNT = (TT_END_MIN - TT_START_MIN) / TT_SLOT_MIN; // 28
const TT_ROW_H = 28; // px per half-hour row

function getWeekDates(offset, anchor) {
  const now = anchor || new Date();
  const day = now.getDay();
  const diffToMon = day === 0 ? -6 : 1 - day;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon + offset*7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    dates.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  return dates;
}

function renderSchedule() {
  const anchor = selectedDate || new Date();
  const dates = getWeekDates(scheduleWeekOffset, anchor);
  const weekdays = ['一','二','三','四','五','六','日'];
  const today = new Date();
  const todayKey = dateKey(today);

  const first = dates[0], last = dates[6];
  document.getElementById('weekLabel').textContent =
    `${first.getMonth()+1}/${first.getDate()} - ${last.getMonth()+1}/${last.getDate()}`;

  const grid = document.getElementById('ttGrid');
  grid.innerHTML = '';

  const HEADER_H = 48;
  const ROW_H = TT_ROW_H; // 28px
  const TIME_COL_W = 70;
  const TOTAL_H = HEADER_H + TT_ROW_COUNT * ROW_H;

  // 行高
  grid.style.gridTemplateRows = `${HEADER_H}px repeat(${TT_ROW_COUNT}, ${ROW_H}px)`;
  grid.style.gridTemplateColumns = `${TIME_COL_W}px repeat(7, 1fr)`;
  grid.style.height = TOTAL_H + 'px';

  // === 背景斑马纹层（按日期列标记节假日底色）===
  const bg = document.createElement('div');
  bg.className = 'tt-bg';
  bg.innerHTML = '';
  // dates 是周一到周日，对应列 0-6
  for (let col = 0; col < 7; col++) {
    const dk = dateKey(dates[col]);
    const info = getDateInfo(dates[col]);
    let colClass = '';
    if (info.holiday) colClass = 'bg-holiday';
    else if (info.exam) colClass = 'bg-exam';
    else if (info.independent) colClass = 'bg-independent';
    if (info.makeup) colClass += ' bg-makeup';

    for (let row = 0; row < TT_ROW_COUNT; row++) {
      const cell = document.createElement('div');
      if (colClass) cell.className = colClass.trim();
      bg.appendChild(cell);
    }
  }
  grid.appendChild(bg);

  // === 表头（grid 定位，行号是整数没问题）===
  const timeHeader = document.createElement('div');
  timeHeader.className = 'tt-header';
  timeHeader.style.gridRow = '1';
  timeHeader.style.gridColumn = '1';
  timeHeader.textContent = '时间';
  grid.appendChild(timeHeader);

  const headerCols = []; // 记录每列在 grid 中的索引（1-based）
  for (let i = 0; i < 7; i++) {
    const d = dates[i];
    const dk = dateKey(d);
    const isWeekend = i >= 5;
    const isToday = dk === todayKey;
    const info = getDateInfo(d);
    let extraCls = '';
    if (info.holiday) extraCls = 'holiday-col';
    else if (info.exam) extraCls = 'exam-col';
    else if (info.independent) extraCls = 'independent-col';
    if (info.makeup) extraCls += ' makeup-col';

    const h = document.createElement('div');
    h.className = `tt-header ${isWeekend ? 'weekend' : ''} ${isToday ? 'today-col' : ''} ${extraCls}`;
    h.style.gridRow = '1';
    h.style.gridColumn = i + 2;
    let subLabel = `${d.getMonth()+1}月${d.getDate()}日`;
    if (info.week) subLabel += ` · W${info.week}`;
    if (info.holiday) subLabel += ` 🏖${info.holiday}`;
    if (info.makeup) subLabel += ` 🔄补课`;
    h.innerHTML = `周${weekdays[i]}<div class="tt-header-date">${subLabel}</div>`;
    grid.appendChild(h);
    headerCols.push(h);
  }

  // === 时间标签列（grid 定位，行号整数）===
  for (let row = 0; row < TT_ROW_COUNT; row++) {
    const mins = TT_START_MIN + row * TT_SLOT_MIN;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (m === 0) {
      const tl = document.createElement('div');
      tl.className = 'tt-time-label';
      tl.style.gridRow = row + 2;
      tl.style.gridColumn = '1';
      tl.textContent = `${pad(h)}:00`;
      grid.appendChild(tl);
    }
  }

  // === 课程 & 事件块（绝对定位，精确到像素）===
  // 先强制布局以获取列宽
  void grid.offsetWidth;

  // 用 header 的 bounding rect 计算每列的像素位置
  const gridRect = grid.getBoundingClientRect();
  const colRects = headerCols.map(h => {
    const r = h.getBoundingClientRect();
    return { left: r.left - gridRect.left, right: r.right - gridRect.left, width: r.width };
  });

  // 记录布局信息（拖拽换位用）
  ttLayout = { grid, colRects, headerTop: HEADER_H, rowH: ROW_H, slotMin: TT_SLOT_MIN, startMin: TT_START_MIN, endMin: TT_END_MIN, rowCount: TT_ROW_COUNT };

  function positionBlock(wk /* 0=日..6=六 */, startMin, endMin) {
    // colRects 按 周一..周日 排列（headerCols[0]=周一），需把 JS weekday(0=日) 转成列索引
    const colIndex = wk === 0 ? 6 : wk - 1;
    const col = colRects[colIndex];
    if (!col) return null;
    const top = HEADER_H + (startMin - TT_START_MIN) / TT_SLOT_MIN * ROW_H;
    const height = (endMin - startMin) / TT_SLOT_MIN * ROW_H;
    return { top, left: col.left + 2, width: col.width - 4, height: height - 2 };
  }

  // 辅助：渲染课程块到指定列
  function renderCourseBlock(course, colIndex /* 0=周一..6=周日 */) {
    const startMin = timeToMinutes(course.start);
    const endMin = timeToMinutes(course.end);
    if (startMin < TT_START_MIN || endMin > TT_END_MIN) return;

    const wkForPos = colIndex === 6 ? 0 : colIndex + 1;
    const pos = positionBlock(wkForPos, startMin, endMin);
    if (!pos || pos.height < 10) return;

    const block = document.createElement('div');
    block.className = 'tt-course' + (course.url ? ' has-url' : '');
    block.style.top = pos.top + 'px';
    block.style.left = pos.left + 'px';
    block.style.width = pos.width + 'px';
    block.style.height = pos.height + 'px';
    block.innerHTML = `
      <div class="cc-code">${escapeHtml(course.name)}</div>
      <div class="cc-type">${escapeHtml(course.type || 'Lecture')}</div>
      <div class="cc-time">${course.start} - ${course.end}</div>
      ${course.location ? `<div class="cc-loc">${escapeHtml(course.location)}</div>` : ''}
    `;
    block._course = course;
    block.onclick = (ev) => showPopupCourseMenu(ev, course);
    block.addEventListener('pointerdown', (ev) => startCourseDrag(ev, course, block));
    grid.appendChild(block);
  }

  // 课程块（只在有课的日期渲染）
  courses.forEach(c => {
    const wk = c.weekday === 7 ? 0 : c.weekday;
    const colIndex = wk === 0 ? 6 : wk - 1;
    const courseDate = dates[colIndex];
    const info = getDateInfo(courseDate);

    // 假期/考试期/独立探索期 → 不渲染
    if (info.holiday || info.exam || info.independent) return;
    // 补课日 → 不在此列渲染（后面由补课逻辑统一处理）
    if (info.makeup) return;

    renderCourseBlock(c, colIndex);
  });

  // 补课日：把补的星期的课程渲染到补课日列
  dates.forEach((d, colIdx) => {
    const info = getDateInfo(d);
    if (info.makeup && info.makeup.weekdayAs) {
      // weekdayAs: 1=周一..6=周六, 7=周日 → 转 colIndex
      const srcWk = info.makeup.weekdayAs === 7 ? 0 : info.makeup.weekdayAs;
      const makeupCourses = courses.filter(cc => {
        const ccWk = cc.weekday === 7 ? 0 : cc.weekday;
        return ccWk === srcWk;
      });
      makeupCourses.forEach(cc => renderCourseBlock(cc, colIdx));
    }
  });

  // 事件块
  events.forEach(e => {
    const ed = new Date(e.date + 'T00:00:00');
    const dk = dateKey(ed);
    if (!dates.some(d => dateKey(d) === dk)) return;
    if (dk < todayKey) return;

    const wk = ed.getDay();
    const startMin = timeToMinutes(e.start);
    const endMin = timeToMinutes(e.end);
    if (startMin < TT_START_MIN || endMin > TT_END_MIN) return;

    const pos = positionBlock(wk, startMin, endMin);
    if (!pos || pos.height < 10) return;

    const cls = e.type === 'exam' ? 'tt-course exam' : 'tt-course event';
    const block = document.createElement('div');
    block.className = cls + (e.url ? ' has-url' : '');
    block.style.top = pos.top + 'px';
    block.style.left = pos.left + 'px';
    block.style.width = pos.width + 'px';
    block.style.height = pos.height + 'px';
    const typeLabel = e.type === 'exam' ? '考试' : '事项';
    block.innerHTML = `
      <div class="cc-code">${escapeHtml(e.title)}</div>
      <div class="cc-type">${typeLabel}</div>
      <div class="cc-time">${e.start} - ${e.end}</div>
      ${e.location ? `<div class="cc-loc">${escapeHtml(e.location)}</div>` : ''}
    `;
    block.onclick = (ev) => showPopupEventMenu(ev, e);
    grid.appendChild(block);
  });

  renderLegend();
  decorateAttachmentBadges();
}

    <div class="legend-item"><span class="legend-dot" style="background:#fadbd8;border-color:#ec7063;"></span>考试</div>
