<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f8ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日历课表">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>我的日历 & 课表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    color: #2c3e50;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(50, 60, 120, 0.1);
    overflow: hidden;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #5a6fd6 0%, #6a4f9e 100%);
    color: #fff;
    padding: 16px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 19px; font-weight: 700; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.3); }
  .btn-primary { background: #4e5db0; border-color: #4e5db0; }
  .btn-primary:hover { background: #3e4d9e; }
  .btn-danger { background: #e74c3c; border-color: #e74c3c; }

  /* ===== View Tabs ===== */
  .view-tabs {
    display: flex;
    padding: 12px 28px 0;
    gap: 2px;
    background: #fff;
    border-bottom: 1px solid #eef0f5;
  }
  .view-tab {
    padding: 8px 18px;
    border: none;
    background: none;
    font-size: 14px;
    font-weight: 500;
    color: #95a5a6;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.15s;
    position: relative;
  }
  .view-tab:hover { color: #5a6fd6; background: #f5f6fa; }
  .view-tab.active {
    color: #5a6fd6;
    background: #f5f6fa;
    font-weight: 600;
  }
  .view-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 10%;
    right: 10%;
    height: 3px;
    background: linear-gradient(90deg, #5a6fd6, #6a4f9e);
    border-radius: 3px 3px 0 0;
  }

  /* ===== Main Layout ===== */
  .main {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
    min-height: 540px;
  }
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .app-header { padding: 14px 16px; }
    .app-title { font-size: 20px; }
    .header-btn { padding: 8px 14px; font-size: 13px; }
    .calendar-section { padding: 12px; }
    .schedule-section { padding: 12px; }
    .calendar-title { font-size: 17px; }
    .day { min-height: 62px; padding: 3px; border-radius: 6px; }
    .day-number { font-size: 12px; }
    .day-week-tag { font-size: 8px; padding: 0 2px; }
    .day-holiday-label { font-size: 8px; bottom: 1px; left: 2px; }
    .day-event-pill { font-size: 9px; padding: 1px 2px; }
    .weekday { font-size: 11px; padding: 4px 0; }
    .nav-btn { width: 30px; height: 30px; font-size: 14px; }
    .events-section { padding: 14px; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  }
  @media (max-width: 480px) {
    .app-title { font-size: 18px; }
    .app-subtitle { font-size: 11px; }
    .day { min-height: 54px; padding: 2px; }
    .day-number { font-size: 11px; }
    .calendar-title { font-size: 16px; }
  }
  .hidden { display: none !important; }

  /* ===== Calendar View ===== */
  .calendar-section { padding: 22px; }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .calendar-title { font-size: 19px; font-weight: 700; color: #2c3e50; }
  .nav-buttons { display: flex; gap: 6px; }
  .nav-btn {
    background: #f0f2f8;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    color: #5a6fd6;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #e2e5f0; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #95a5a6;
    padding: 6px 0;
  }
  .weekday.weekend { color: #e74c3c; }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day {
    min-height: 72px;
    border: 1px solid #eef0f5;
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
    position: relative;
    overflow: hidden;
  }
  .day:hover {
    border-color: #5a6fd6;
    box-shadow: 0 2px 8px rgba(90,111,214,0.15);
  }
  .day.other-month { background: #fafbfc; color: #cbd5db; }
  .day.past { background: #fafbfc; color: #cbd5db; cursor: default; }
  .day.past:hover { border-color: #eef0f5; box-shadow: none; }
  .day.today {
    background: linear-gradient(135deg, rgba(90,111,214,0.1), rgba(106,79,158,0.1));
    border-color: #5a6fd6;
    font-weight: 700;
  }
  .day.selected {
    border-color: #6a4f9e;
    box-shadow: 0 0 0 2px rgba(106,79,158,0.18);
  }
  .day.has-events::after {
    content: '';
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    background: #e74c3c;
    border-radius: 50%;
  }
  /* 节假日底色 */
  .day.holiday {
    background: linear-gradient(135deg, #ffeaea, #ffd6d6);
    border-color: #f5b7b1;
  }
  .day.holiday .day-number::before {
    content: '🏖 ';
  }
  /* 考试期底色 */
  .day.exam {
    background: linear-gradient(135deg, #fef9e7, #fdebd0);
    border-color: #f5cba7;
  }
  .day.exam .day-number::before {
    content: '📝 ';
  }
  /* 独立探索期 */
  .day.independent {
    background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
    border-color: #a9dfbf;
  }
  /* 补课日 */
  .day.makeup {
    background: linear-gradient(135deg, #f5eef8, #e8daef);
    border-color: #d2b4de;
  }
  .day.makeup .day-number::before {
    content: '🔄 ';
  }
  /* 周次标签 - 移到右上角避免与日期重叠 */
  .day-week-tag {
    position: absolute;
    top: 2px;
    right: 3px;
    font-size: 9px;
    color: #8e44ad;
    font-weight: 600;
    background: rgba(142,68,173,0.12);
    padding: 0 3px;
    border-radius: 3px;
    line-height: 1.3;
    z-index: 2;
  }
  .day-holiday-label {
    position: absolute;
    bottom: 2px;
    left: 4px;
    font-size: 9px;
    color: #c0392b;
    font-weight: 500;
    background: rgba(255,255,255,0.7);
    padding: 0 3px;
    border-radius: 3px;
    line-height: 1.3;
    max-width: calc(100% - 8px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .day-number { font-size: 13px; margin-bottom: 2px; padding-left: 2px; }
  .day-events { font-size: 10px; display: flex; flex-direction: column; gap: 1px; }
  .day-event-pill {
    color: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    line-height: 1.4;
    text-align: center;
  }
  .pill-exam   { background: #e74c3c; }
  .pill-event  { background: #95a5a6; }

  /* ===== Events Sidebar ===== */
  .events-section {
    background: #f8f9fc;
    padding: 22px 20px;
    border-left: 1px solid #eef0f5;
    display: flex;
    flex-direction: column;
  }
  .events-section h2 {
    font-size: 15px;
    margin-bottom: 2px;
    color: #2c3e50;
    font-weight: 700;
  }
  .selected-date-label {
    font-size: 11px;
    color: #95a5a6;
    margin-bottom: 12px;
  }
  .jump-schedule-btn {
    display: none;
    margin-bottom: 12px;
    padding: 6px 10px;
    background: #5a6fd6;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
  }
  .jump-schedule-btn:hover { background: #4a5cc5; }
  .events-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
  .event-card {
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    border-left: 3px solid #5a6fd6;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .event-card.exam { border-left-color: #e74c3c; }
  .event-card.course { border-left-color: #2e7d32; }
  .event-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: #2c3e50; }
  .event-time { font-size: 11px; color: #7f8c8d; }
  .event-location { font-size: 11px; color: #5a6fd6; margin-top: 1px; }
  .event-actions {
    margin-top: 6px;
    display: flex;
    gap: 6px;
  }
  .event-actions button {
    background: #f0f2f8;
    border: none;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    color: #5a6fd6;
  }
  .event-actions button:hover { background: #e2e5f0; }
  .event-actions .delete-btn { background: #fde8e7; color: #e74c3c; }
  .event-actions .delete-btn:hover { background: #f8d4d2; }
  .empty-state {
    text-align: center;
    color: #b2bec3;
    padding: 24px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-state small { display: block; margin-top: 6px; font-size: 11px; }

  /* ===== Schedule View (HKU style) ===== */
  .schedule-section {
    padding: 20px 24px 24px;
    overflow-x: auto;
  }
  .schedule-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .schedule-title { font-size: 17px; font-weight: 700; color: #2c3e50; }
  .schedule-nav { display: flex; gap: 6px; align-items: center; }
  .schedule-nav .nav-btn { width: 32px; height: 32px; }
  .week-label { font-size: 12px; color: #7f8c8d; font-weight: 500; padding: 0 6px; }

  /* HKU-style timetable */
  .tt-grid {
    position: relative;
    display: grid;
    grid-template-columns: 70px repeat(7, 1fr);
    background: #e0e0e0;
    border-radius: 4px;
    overflow: visible;
    min-width: 780px;
    gap: 1px;
    border: 1px solid #d0d0d0;
  }
  /* 网格背景层（用于斑马纹） */
  .tt-bg {
    position: absolute;
    top: 48px;
    left: 70px;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 28px;
    gap: 1px;
    z-index: 0;
    pointer-events: none;
  }
  .tt-bg > div {
    background: #fafbfc;
  }
  .tt-bg > div:nth-child(even) {
    background: #f2f4f8;
  }
  /* 课表节假日底色 */
  .tt-bg .bg-holiday {
    background: linear-gradient(135deg, #ffeaea, #ffd6d6) !important;
  }
  .tt-bg .bg-exam {
    background: linear-gradient(135deg, #fef9e7, #fdebd0) !important;
  }
  .tt-bg .bg-independent {
    background: linear-gradient(135deg, #e8f8f5, #d1f2eb) !important;
  }
  .tt-bg .bg-makeup {
    background: linear-gradient(135deg, #f5eef8, #e8daef) !important;
  }
  /* 课表表头节假日标记 */
  .tt-header.holiday-col {
    background: linear-gradient(180deg, #fadbd8, #e8edf5) !important;
    color: #c0392b;
  }
  .tt-header.exam-col {
    background: linear-gradient(180deg, #fdebd0, #e8edf5) !important;
    color: #b7950b;
  }
  .tt-header.independent-col {
    background: linear-gradient(180deg, #d1f2eb, #e8edf5) !important;
    color: #16a085;
  }
  .tt-header.makeup-col {
    background: linear-gradient(180deg, #e8daef, #e8edf5) !important;
    color: #8e44ad;
  }
  .tt-header {
    background: #e8edf5;
    text-align: center;
    font-weight: 600;
    padding: 10px 4px;
    font-size: 12px;
    color: #3a4a6a;
    border-bottom: 2px solid #c5cdd8;
  }
  .tt-header.weekend { color: #c0392b; }
  .tt-header.today-col {
    background: linear-gradient(180deg, #d4e4ff, #e8edf5);
    color: #5a6fd6;
    font-weight: 700;
  }
  .tt-header-date {
    font-weight: 400;
    font-size: 10px;
    color: #7f8c8d;
    margin-top: 2px;
  }
  .tt-time-label {
    background: #f5f6fa;
    text-align: right;
    padding: 2px 8px 2px 0;
    font-size: 10.5px;
    color: #6c7a89;
    font-weight: 500;
  }
  .tt-course {
    position: absolute;
    background: #d4edda;
    border: 1px solid #82c98c;
    border-radius: 4px;
    padding: 5px 8px;
    color: #2d3d2f;
    font-size: 11px;
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow 0.15s, transform 0.15s;
    z-index: 2;
    box-sizing: border-box;
  }
  .tt-course:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transform: scale(1.01);
    z-index: 10;
  }
  .tt-course .cc-code {
    font-weight: 700;
    font-size: 11.5px;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .tt-course .cc-type {
    font-size: 10px;
    color: #5a7a60;
    margin-bottom: 1px;
  }
  .tt-course .cc-time {
    font-size: 10px;
    color: #5a7a60;
    margin-bottom: 1px;
  }
  .tt-course .cc-loc {
    font-size: 10px;
    color: #3d5a45;
    font-weight: 500;
  }
  .tt-course.exam {
    background: #fadbd8;
    border-color: #ec7063;
    color: #7b241c;
  }
  .tt-course.exam .cc-type,
  .tt-course.exam .cc-time { color: #a93226; }
  .tt-course.event {
    background: #e8daef;
    border-color: #bb8fce;
    color: #4a235a;
  }
  .tt-course.event .cc-type,
  .tt-course.event .cc-time { color: #7d3c98; }

  .tt-legend {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
    background: #f8f9fc;
    border-radius: 8px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #7f8c8d; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(30, 30, 60, 0.45);
    z-index: 100;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.15s ease;
  }
  .modal-overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 92%;
    max-width: 400px;
    animation: slideUp 0.2s ease;
    box-shadow: 0 16px 50px rgba(0,0,0,0.18);
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; color: #2c3e50; font-weight: 700; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
    color: #7f8c8d;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e4e8f0;
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fafbfc;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: #5a6fd6;
    box-shadow: 0 0 0 3px rgba(90,111,214,0.12);
    background: #fff;
  }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .reminder-status {
    margin-top: 12px;
    padding: 8px 12px;
    background: #f0f2f8;
    border-radius: 7px;
    font-size: 11px;
    color: #7f8c8d;
    text-align: center;
  }
  .reminder-status.enabled { background: #e8f5e9; color: #2e7d32; }

  /* ===== 课程操作弹出菜单 ===== */
  .popup-menu {
    position: fixed;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    padding: 6px;
    min-width: 160px;
    z-index: 200;
    animation: popIn 0.12s ease;
    border: 1px solid #eef0f5;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .popup-menu .pm-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: #2c3e50;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .popup-menu .pm-item:hover { background: #f0f2f8; }
  .popup-menu .pm-item.danger { color: #e74c3c; }
  .popup-menu .pm-item.danger:hover { background: #fde8e7; }
  .popup-menu .pm-divider {
    height: 1px;
    background: #eef0f5;
    margin: 4px 6px;
  }
  .popup-menu .pm-item .pm-icon { font-size: 14px; width: 16px; text-align: center; }
  .popup-menu .pm-hint {
    font-size: 11px;
    color: #95a5a6;
    padding: 4px 12px 8px;
  }

  /* 课程块有 url 时显示小链接图标 */
  .tt-course.has-url::after {
    content: '🔗';
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
  }

  /* ===== 开屏动画 ===== */
  .splash-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #4f2e7e 0%, #6a4f9e 50%, #8e44ad 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease;
  }
  .splash-screen.hide {
    opacity: 0;
    pointer-events: none;
  }
  .splash-content {
    text-align: center;
    animation: splashFadeIn 0.8s ease;
  }
  .splash-crest {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    padding: 12px;
    box-shadow: 0 0 40px rgba(255,255,255,0.3);
    animation: crestPulse 2s ease-in-out infinite;
  }
  .splash-title {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    margin: 20px 0 6px;
    letter-spacing: 1px;
  }
  .splash-sub {
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .splash-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes splashFadeIn {
    from { opacity: 0; transform: scale(0.9); }

/* ================================================================

================================================================ */

const APP_VERSION_CODE = 3;
const VERSION_CHECK_URL = './version.json';
const STORAGE_KEY = 'calendar_events_v5';
let events = [];        // 日程事件（exam / event，含具体日期）
let courses = [];       // 课程（course，按 weekday 重复）
let currentView = new Date();

let editingId = null;

const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const TODAY_KEY = dateKey(TODAY);

// 默认事件（具体日期的一次性事件）
const DEFAULT_EVENTS = [

// 默认课程（按星期重复，无具体日期）

const DEFAULT_COURSES = [

  { id:'eco-t01', name:'ECO 2011-T01', weekday:1, start:'18:00', end:'18:50', location:'Teaching A Bldg 107', type:'Tutorial', instructor:'W. LIANG', crn:'2761', url:'' },
  { id:'eng-l15', name:'ENG 1001-L15', weekday:2, start:'13:30', end:'14:50', location:'Teaching D Bldg 109', type:'Lecture', instructor:'Q. WANG', crn:'2850', url:'' },

  { id:'mat-l05b', name:'MAT 1001-L05', weekday:4, start:'10:30', end:'12:20', location:'Teaching Complex C301', type:'Lecture', instructor:'K. FANG', crn:'3035', url:'' },
  { id:'mat-t20', name:'MAT 1001-T20', weekday:5, start:'19:30', end:'20:50', location:'Teaching A Bldg 301', type:'Tutorial', instructor:'员工', crn:'3060', url:'' },
  { id:'cec-l08', name:'CEC 1000-L08', weekday:5, start:'14:30', end:'17:20', location:'Teaching Complex C203', type:'Lecture', instructor:'J. YANG', crn:'3783', url:'' },
  { id:'chi-l19', name:'CHI 1000-L19', weekday:1, start:'15:30', end:'16:50', location:'Teaching B Bldg 304', type:'Lecture', instructor:'W. WONG', crn:'2825', url:'' },
  { id:'chi-l19b', name:'CHI 1000-L19', weekday:3, start:'15:30', end:'16:50', location:'Teaching B Bldg 304', type:'Lecture', instructor:'W. WONG', crn:'2825', url:'' },
  { id:'dai-l05', name:'DAI 1000-L05', weekday:3, start:'08:30', end:'09:20', location:'Teaching C Bldg 106', type:'Lecture', instructor:'R. LIAO', crn:'4257', url:'' },
  { id:'ped-l01', name:'PED 1109-L01', weekday:2, start:'08:30', end:'10:20', location:'Track Field', type:'Lecture', instructor:'Y. ZHANG', crn:'4290', url:'' }
];

/* ================================================================
   CUHK 2026-27 校历数据
================================================================ */
// 教学学期
const SEMESTERS = [
  { name: '第一学期', start: '2026-09-07', end: '2026-12-18' },
  { name: '独立探索期', start: '2026-12-28', end: '2027-01-10', type: 'independent' },
  { name: '第二学期', start: '2027-01-11', end: '2027-05-14' },
  { name: '暑期课程', start: '2027-05-31', end: '2027-07-16' }
];

// 考试期
const EXAM_PERIODS = [
  { name: '第一学期考试', start: '2026-12-20', end: '2026-12-27' },
  { name: '第二学期考试', start: '2027-05-15', end: '2027-05-22' },
  { name: '暑期课程考试', start: '2027-07-19', end: '2027-07-21' }
];

// 节假日（公众假期 + 农历新年）
const HOLIDAYS = [
  { start: '2026-09-25', end: '2026-09-27', name: '中秋节' },
  { start: '2026-10-01', end: '2026-10-07', name: '国庆节' },
  { start: '2027-01-25', end: '2027-02-14', name: '农历新年' },
  { start: '2027-04-05', end: '2027-04-05', name: '清明节' },
  { start: '2027-05-01', end: '2027-05-01', name: '劳动节' },
  { start: '2027-06-09', end: '2027-06-09', name: '端午节' }
];

// 补课日（这天按星期五的课表上课）
const MAKEUP_DAYS = [
  { date: '2026-09-20', weekdayAs: 5, name: '补课(周五)' }
];

/* ================================================================
   校历辅助函数
================================================================ */
function dkToDate(dk) { return new Date(dk + 'T00:00:00'); }

// 判断某天是否在某个范围
function inRange(dk, start, end) { return dk >= start && dk <= end; }

// 获取日期完整信息
function getDateInfo(d) {
  const dk = dateKey(d);
  const info = { semester: null, week: null, holiday: null, makeup: null, exam: false, independent: false };

  // 学期 & 周次
  for (const s of SEMESTERS) {
    if (dk >= s.start && dk <= s.end) {
      info.semester = s.name;
      if (s.type === 'independent') {
        info.independent = true;
      } else {
        // 计算第几周（以周一为周首）
        const startDate = dkToDate(s.start);
        // 如果学期开始不是周一，回溯到该周的周一
        const startDay = startDate.getDay();
        const diffToMon = startDay === 0 ? -6 : 1 - startDay;
        const week1Monday = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + diffToMon);
        const dMonday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
        const weeksDiff = Math.round((dMonday - week1Monday) / (7 * 86400000));
        info.week = weeksDiff + 1;
      }
      break;
    }
  }

  // 考试期
  for (const ep of EXAM_PERIODS) {
    if (dk >= ep.start && dk <= ep.end) {
      info.exam = true;
      if (!info.semester) info.semester = ep.name;
      break;
    }
  }

  // 节假日
  for (const h of HOLIDAYS) {
    if (dk >= h.start && dk <= h.end) { info.holiday = h.name; break; }
  }

  // 补课
  for (const m of MAKEUP_DAYS) {
    if (dk === m.date) { info.makeup = m; break; }
  }

  return info;
}

// 判断某天是否有课（非假期、非考试期、非独立探索期）
function hasSchool(d) {
  const info = getDateInfo(d);
  if (info.holiday) return false;
  if (info.exam) return false;
  if (info.independent) return false;
  return true;
}

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeToMinutes(t) { const [h,m] = t.split(':').map(Number); return h*60 + m; }
function formatRemind(min) {
  if (min < 60) return `${min}分钟`;
  if (min < 1440) return `${min/60}小时`;
  return `${min/1440}天`;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) {
      events = [...DEFAULT_EVENTS];
      courses = [...DEFAULT_COURSES];
      saveData();
    } else {
      const data = JSON.parse(raw);
      events = data.events || [...DEFAULT_EVENTS];
      courses = data.courses || [...DEFAULT_COURSES];
      if (!events.find(e => e.id === 'default-csc-exam')) {
        events.unshift(...DEFAULT_EVENTS);
        saveData();
      }
    }
  } catch(e) {
    events = [...DEFAULT_EVENTS];
    courses = [...DEFAULT_COURSES];
  }
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ events, courses }));
}

/* ================================================================
   日历渲染（只显示非课程事件）
================================================================ */
function renderCalendar() {
  const year = currentView.getFullYear();
  const month = currentView.getMonth();
  document.getElementById('calendarTitle').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysPrevMonth = new Date(year, month, 0).getDate();

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  for (let i = startWeekday - 1; i >= 0; i--) {
    const d = daysPrevMonth - i;
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${d}</div>`;
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = dateKey(date);
    const isPast = key < TODAY_KEY;
    const isToday = key === TODAY_KEY;
    const isSelected = selectedDate && key === dateKey(selectedDate);
    const info = getDateInfo(date);

    const cell = document.createElement('div');
    cell.className = 'day';
    if (isPast) cell.classList.add('past');
    if (isToday) cell.classList.add('today');
    if (isSelected) cell.classList.add('selected');

    // 特殊周底色（优先级：假期 > 考试 > 独立 > 补课）
    if (info.holiday) cell.classList.add('holiday');
    else if (info.exam) cell.classList.add('exam');
    else if (info.independent) cell.classList.add('independent');
    if (info.makeup) cell.classList.add('makeup');

    // 只取非课程的事件（exam + event）
    let pillsHtml = '';
    if (!isPast) {
      const dayEvents = events.filter(e => e.date === key);
      if (dayEvents.length > 0) cell.classList.add('has-events');
      dayEvents.slice(0, 3).forEach(e => {
        const cls = e.type === 'exam' ? 'pill-exam' : 'pill-event';
        const label = e.type === 'exam' ? '考试' : (e.title.length > 4 ? e.title.slice(0,4) : e.title);
        pillsHtml += `<div class="day-event-pill ${cls}">${escapeHtml(label)}</div>`;
      });
      if (dayEvents.length > 3) {
        pillsHtml += `<div class="day-event-pill pill-event">+${dayEvents.length - 3}</div>`;
      }
    }

    // 周次标签（学期内且有周次）
    const weekTag = (info.week && !isPast) ? `<div class="day-week-tag">W${info.week}</div>` : '';
    // 节假日/补课标签
    const holidayLabel = info.holiday ? `<div class="day-holiday-label">${escapeHtml(info.holiday)}</div>` :
                         info.makeup ? `<div class="day-holiday-label" style="color:#8e44ad;">补课</div>` : '';

    cell.innerHTML = `${weekTag}<div class="day-number">${d}</div><div class="day-events">${pillsHtml}</div>${holidayLabel}`;
    if (!isPast) {
      cell.onclick = () => {
        selectedDate = date;
        renderCalendar();
        renderEventsList();
        renderSchedule();
      };
    }
    grid.appendChild(cell);
  }

  const totalCells = startWeekday + daysInMonth;
  const tail = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= tail; i++) {
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${i}</div>`;
    grid.appendChild(cell);
  }
}

/* ================================================================
   右侧栏渲染（课程 + 事件 全部显示）
================================================================ */
function renderEventsList() {
  const list = document.getElementById('eventsList');
  const label = document.getElementById('selectedDateLabel');
  const jumpBtn = document.getElementById('jumpScheduleBtn');

  if (!selectedDate) {
    label.textContent = '';
    jumpBtn.style.display = 'none';
    list.innerHTML = '<div class="empty-state">👆 点击日历上的日期查看详情</div>';
    return;
  }

  const key = dateKey(selectedDate);
  const weekdayNames = ['日','一','二','三','四','五','六'];
  const info = getDateInfo(selectedDate);
  let labelText = `${selectedDate.getFullYear()}/${selectedDate.getMonth()+1}/${selectedDate.getDate()} · 周${weekdayNames[selectedDate.getDay()]}`;

  // 附加校历信息
  if (info.semester) {
    labelText += ` · ${info.semester}`;
    if (info.week) labelText += ` 第${info.week}周`;
  } else if (info.exam) {
    labelText += ` · 考试期`;
  }
  if (info.holiday) labelText += ` · 🏖 ${info.holiday}`;
  if (info.makeup) labelText += ` · 🔄 ${info.makeup.name}`;

  label.textContent = labelText;

  // 根据日期计算该上什么课（考虑假期/考试/补课）
  const weekday = selectedDate.getDay();

  // 补课时，用补的星期查课
  const effectiveWeekday = (info.makeup && info.makeup.weekdayAs) ? info.makeup.weekdayAs : weekday;
  let dayCourses = courses.filter(c => c.weekday === effectiveWeekday);

  // 假期/考试期/独立探索期 → 不上课（除非是补课日）
  if (!hasSchool(selectedDate) && !info.makeup) {
    dayCourses = [];
  }

  jumpBtn.style.display = dayCourses.length > 0 ? 'block' : 'none';

  const dayEvents = events.filter(e => e.date === key);

  // 过去日期
  if (key < TODAY_KEY) {
    list.innerHTML = '<div class="empty-state">📌 此日期已过</div>';
    return;
  }

  // 特殊日期提示
  let specialHint = '';
  if (info.holiday) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">🏖</span> 公众假期「${info.holiday}」，不上课</div>`;
  else if (info.exam) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">📝</span> 考试期，不上课</div>`;
  else if (info.independent) specialHint = `<div class="empty-state" style="padding:10px;"><span style="font-size:16px;">🔬</span> 独立探索期，不上课</div>`;
  if (info.makeup) {
    specialHint = `<div class="empty-state" style="padding:10px;background:#f5eef8;"><span style="font-size:16px;">🔄</span> 补课日：今日按「周五」课表上课</div>`;
  }

  if (dayCourses.length === 0 && dayEvents.length === 0) {
    list.innerHTML = specialHint || '<div class="empty-state">🍃 今日无事项</div>';
    return;
  }

  let html = specialHint || '';
  // 课程
  dayCourses.sort((a,b) => a.start.localeCompare(b.start));
  dayCourses.forEach(c => {
    html += `
      <div class="event-card course">
        <div class="event-title">📘 ${escapeHtml(c.name)}</div>
        <div class="event-time">⏰ ${c.start} - ${c.end} · ${escapeHtml(c.type || 'Lecture')}</div>
        ${c.location ? `<div class="event-location">📍 ${escapeHtml(c.location)}</div>` : ''}
        <div class="event-actions">
          <button onclick="editCourse('${c.id}')">编辑</button>
          <button class="delete-btn" onclick="deleteCourse('${c.id}')">删除</button>
        </div>
      </div>`;
  });
  // 事件
  dayEvents.sort((a,b) => a.start.localeCompare(b.start));
  dayEvents.forEach(e => {
    html += `
      <div class="event-card ${e.type === 'exam' ? 'exam' : ''}">
        <div class="event-title">${e.type === 'exam' ? '📕 ' : '📌 '}${escapeHtml(e.title)}</div>
        <div class="event-time">⏰ ${e.start} - ${e.end}${e.remind > 0 ? ` · 提前${formatRemind(e.remind)}提醒` : ''}</div>
        ${e.location ? `<div class="event-location">📍 ${escapeHtml(e.location)}</div>` : ''}
        <div class="event-actions">
          <button onclick="editEvent('${e.id}')">编辑</button>
          <button class="delete-btn" onclick="deleteEvent('${e.id}')">删除</button>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

/* ================================================================
   HKU 风格周课表
================================================================ */
// 从 08:00 到 22:00，每 30 分钟一行
const TT_START_MIN = 8 * 60;   // 480
const TT_END_MIN = 22 * 60;    // 1320
const TT_SLOT_MIN = 30;
const TT_ROW_COUNT = (TT_END_MIN - TT_START_MIN) / TT_SLOT_MIN; // 28
const TT_ROW_H = 28; // px per half-hour row

function getWeekDates(offset, anchor) {
  const now = anchor || new Date();
  const day = now.getDay();
  const diffToMon = day === 0 ? -6 : 1 - day;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon + offset*7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    dates.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  return dates;
}

function renderSchedule() {
  const anchor = selectedDate || new Date();
  const dates = getWeekDates(scheduleWeekOffset, anchor);
  const weekdays = ['一','二','三','四','五','六','日'];
  const today = new Date();
  const todayKey = dateKey(today);

  const first = dates[0], last = dates[6];
  document.getElementById('weekLabel').textContent =
    `${first.getMonth()+1}/${first.getDate()} - ${last.getMonth()+1}/${last.getDate()}`;

  const grid = document.getElementById('ttGrid');
  grid.innerHTML = '';

  const HEADER_H = 48;
  const ROW_H = TT_ROW_H; // 28px
  const TIME_COL_W = 70;
  const TOTAL_H = HEADER_H + TT_ROW_COUNT * ROW_H;

  // 行高
  grid.style.gridTemplateRows = `${HEADER_H}px repeat(${TT_ROW_COUNT}, ${ROW_H}px)`;
  grid.style.gridTemplateColumns = `${TIME_COL_W}px repeat(7, 1fr)`;
  grid.style.height = TOTAL_H + 'px';

  // === 背景斑马纹层（按日期列标记节假日底色）===
  const bg = document.createElement('div');
  bg.className = 'tt-bg';
  bg.innerHTML = '';
  // dates 是周一到周日，对应列 0-6
  for (let col = 0; col < 7; col++) {
    const dk = dateKey(dates[col]);
    const info = getDateInfo(dates[col]);
    let colClass = '';
    if (info.holiday) colClass = 'bg-holiday';
    else if (info.exam) colClass = 'bg-exam';
    else if (info.independent) colClass = 'bg-independent';
    if (info.makeup) colClass += ' bg-makeup';

    for (let row = 0; row < TT_ROW_COUNT; row++) {
      const cell = document.createElement('div');
      if (colClass) cell.className = colClass.trim();
      bg.appendChild(cell);
    }
  }
  grid.appendChild(bg);

  // === 表头（grid 定位，行号是整数没问题）===
  const timeHeader = document.createElement('div');
  timeHeader.className = 'tt-header';
  timeHeader.style.gridRow = '1';
  timeHeader.style.gridColumn = '1';
  timeHeader.textContent = '时间';
  grid.appendChild(timeHeader);

  const headerCols = []; // 记录每列在 grid 中的索引（1-based）
  for (let i = 0; i < 7; i++) {
    const d = dates[i];
    const dk = dateKey(d);
    const isWeekend = i >= 5;
    const isToday = dk === todayKey;
    const info = getDateInfo(d);
    let extraCls = '';
    if (info.holiday) extraCls = 'holiday-col';
    else if (info.exam) extraCls = 'exam-col';
    else if (info.independent) extraCls = 'independent-col';
    if (info.makeup) extraCls += ' makeup-col';

    const h = document.createElement('div');
    h.className = `tt-header ${isWeekend ? 'weekend' : ''} ${isToday ? 'today-col' : ''} ${extraCls}`;
    h.style.gridRow = '1';
    h.style.gridColumn = i + 2;
    let subLabel = `${d.getMonth()+1}月${d.getDate()}日`;
    if (info.week) subLabel += ` · W${info.week}`;
    if (info.holiday) subLabel += ` 🏖${info.holiday}`;
    if (info.makeup) subLabel += ` 🔄补课`;
    h.innerHTML = `周${weekdays[i]}<div class="tt-header-date">${subLabel}</div>`;
    grid.appendChild(h);
    headerCols.push(h);
  }

  // === 时间标签列（grid 定位，行号整数）===
  for (let row = 0; row < TT_ROW_COUNT; row++) {
    const mins = TT_START_MIN + row * TT_SLOT_MIN;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (m === 0) {
      const tl = document.createElement('div');
      tl.className = 'tt-time-label';
      tl.style.gridRow = row + 2;
      tl.style.gridColumn = '1';
      tl.textContent = `${pad(h)}:00`;
      grid.appendChild(tl);
    }
  }

  // === 课程 & 事件块（绝对定位，精确到像素）===
  // 先强制布局以获取列宽
  void grid.offsetWidth;

  // 用 header 的 bounding rect 计算每列的像素位置
  const gridRect = grid.getBoundingClientRect();
  const colRects = headerCols.map(h => {
    const r = h.getBoundingClientRect();
    return { left: r.left - gridRect.left, right: r.right - gridRect.left, width: r.width };
  });

  function positionBlock(wk /* 0=日..6=六 */, startMin, endMin) {
    // colRects 按 周一..周日 排列（headerCols[0]=周一），需把 JS weekday(0=日) 转成列索引
    const colIndex = wk === 0 ? 6 : wk - 1;
    const col = colRects[colIndex];
    if (!col) return null;
    const top = HEADER_H + (startMin - TT_START_MIN) / TT_SLOT_MIN * ROW_H;
    const height = (endMin - startMin) / TT_SLOT_MIN * ROW_H;
    return { top, left: col.left + 2, width: col.width - 4, height: height - 2 };
  }

  // 辅助：渲染课程块到指定列
  function renderCourseBlock(course, colIndex /* 0=周一..6=周日 */) {
    const startMin = timeToMinutes(course.start);
    const endMin = timeToMinutes(course.end);
    if (startMin < TT_START_MIN || endMin > TT_END_MIN) return;

    const wkForPos = colIndex === 6 ? 0 : colIndex + 1;
    const pos = positionBlock(wkForPos, startMin, endMin);
    if (!pos || pos.height < 10) return;

    const block = document.createElement('div');
    block.className = 'tt-course' + (course.url ? ' has-url' : '');
    block.style.top = pos.top + 'px';
    block.style.left = pos.left + 'px';
    block.style.width = pos.width + 'px';
    block.style.height = pos.height + 'px';
    block.innerHTML = `
      <div class="cc-code">${escapeHtml(course.name)}</div>
      <div class="cc-type">${escapeHtml(course.type || 'Lecture')}</div>
      <div class="cc-time">${course.start} - ${course.end}</div>
      ${course.location ? `<div class="cc-loc">${escapeHtml(course.location)}</div>` : ''}
    `;
    block.onclick = (ev) => showPopupCourseMenu(ev, course);
    grid.appendChild(block);
  }

  // 课程块（只在有课的日期渲染）
  courses.forEach(c => {
    const wk = c.weekday === 7 ? 0 : c.weekday;
    const colIndex = wk === 0 ? 6 : wk - 1;
    const courseDate = dates[colIndex];
    const info = getDateInfo(courseDate);

    // 假期/考试期/独立探索期 → 不渲染
    if (info.holiday || info.exam || info.independent) return;
    // 补课日 → 不在此列渲染（后面由补课逻辑统一处理）
    if (info.makeup) return;

    renderCourseBlock(c, colIndex);
  });

  // 补课日：把补的星期的课程渲染到补课日列
  dates.forEach((d, colIdx) => {
    const info = getDateInfo(d);
    if (info.makeup && info.makeup.weekdayAs) {
      // weekdayAs: 1=周一..6=周六, 7=周日 → 转 colIndex
      const srcWk = info.makeup.weekdayAs === 7 ? 0 : info.makeup.weekdayAs;
      const makeupCourses = courses.filter(cc => {
        const ccWk = cc.weekday === 7 ? 0 : cc.weekday;
        return ccWk === srcWk;
      });
      makeupCourses.forEach(cc => renderCourseBlock(cc, colIdx));
    }
  });

  // 事件块
  events.forEach(e => {
    const ed = new Date(e.date + 'T00:00:00');
    const dk = dateKey(ed);
    if (!dates.some(d => dateKey(d) === dk)) return;
    if (dk < todayKey) return;

    const wk = ed.getDay();
    const startMin = timeToMinutes(e.start);
    const endMin = timeToMinutes(e.end);
    if (startMin < TT_START_MIN || endMin > TT_END_MIN) return;

    const pos = positionBlock(wk, startMin, endMin);
    if (!pos || pos.height < 10) return;

    const cls = e.type === 'exam' ? 'tt-course exam' : 'tt-course event';
    const block = document.createElement('div');
    block.className = cls + (e.url ? ' has-url' : '');
    block.style.top = pos.top + 'px';
    block.style.left = pos.left + 'px';
    block.style.width = pos.width + 'px';
    block.style.height = pos.height + 'px';
    const typeLabel = e.type === 'exam' ? '考试' : '事项';
    block.innerHTML = `
      <div class="cc-code">${escapeHtml(e.title)}</div>
      <div class="cc-type">${typeLabel}</div>
      <div class="cc-time">${e.start} - ${e.end}</div>
      ${e.location ? `<div class="cc-loc">${escapeHtml(e.location)}</div>` : ''}
    `;
    block.onclick = (ev) => showPopupEventMenu(ev, e);
    grid.appendChild(block);
  });

  renderLegend();
}

function renderLegend() {
  const legend = document.getElementById('ttLegend');
  legend.innerHTML = `
    <div class="legend-item"><span class="legend-dot" style="background:#d4edda;border-color:#82c98c;"></span>课程</div>
    <div class="legend-item"><span class="legend-dot" style="background:#fadbd8;border-color:#ec7063;"></span>考试</div>
    <div class="legend-item"><span class="legend-dot" style="background:#e8daef;border-color:#bb8fce;"></span>其他事项</div>

    <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#fef9e7,#fdebd0);border-color:#f5cba7;"></span>考试期</div>

function openModal(event, course) {
  document.getElementById('modalOverlay').classList.add('active');

    editingId = course.id;
    editingKind = 'course';
    document.getElementById('modalTitle').textContent = '编辑课程';
    document.getElementById('eventTitle').value = course.name;
    document.getElementById('eventWeekday').value = course.weekday === 7 ? 0 : course.weekday;
    document.getElementById('eventDate').value = '';
    document.getElementById('eventStart').value = course.start;
    document.getElementById('eventEnd').value = course.end;
    document.getElementById('eventLocation').value = course.location || '';
    document.getElementById('eventUrl').value = course.url || '';
    document.getElementById('eventType').value = 'course';
    document.getElementById('eventRemind').value = '0';
  } else if (event) {
    editingId = event.id;
    editingKind = 'event';
    document.getElementById('modalTitle').textContent = event.type === 'exam' ? '编辑考试' : '编辑事项';
    document.getElementById('eventTitle').value = event.title;
    document.getElementById('eventWeekday').value = selectedDate ? selectedDate.getDay() : 1;
    document.getElementById('eventDate').value = event.date;
    document.getElementById('eventStart').value = event.start;
    document.getElementById('eventEnd').value = event.end;
    document.getElementById('eventLocation').value = event.location || '';
    document.getElementById('eventUrl').value = event.url || '';
    document.getElementById('eventType').value = event.type;
    document.getElementById('eventRemind').value = event.remind;
  } else {
    editingId = null;
    editingKind = null;
    document.getElementById('modalTitle').textContent = '新增';
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventWeekday').value = selectedDate ? selectedDate.getDay() : 1;
    document.getElementById('eventDate').value = selectedDate ? dateKey(selectedDate) : TODAY_KEY;
    document.getElementById('eventStart').value = '09:00';
    document.getElementById('eventEnd').value = '10:00';
    document.getElementById('eventLocation').value = '';
    document.getElementById('eventUrl').value = '';
    document.getElementById('eventType').value = 'course';
    document.getElementById('eventRemind').value = '0';
  }
  updateModalFields();
}

function updateModalFields() {
  const type = document.getElementById('eventType').value;
  const weekdayGroup = document.getElementById('weekdayGroup');
  const dateGroup = document.getElementById('dateGroup');
  const remindGroup = document.getElementById('remindGroup');
  const urlGroup = document.getElementById('urlGroup');

  if (type === 'course') {
    weekdayGroup.style.display = '';
    dateGroup.style.display = 'none';
    remindGroup.style.display = 'none';

    remindGroup.style.display = '';
    urlGroup.style.display = '';
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function saveItem() {
  const title = document.getElementById('eventTitle').value.trim();
  const type = document.getElementById('eventType').value;
  const start = document.getElementById('eventStart').value;
  const end = document.getElementById('eventEnd').value;
  const location = document.getElementById('eventLocation').value.trim();
  const url = document.getElementById('eventUrl').value.trim();

  if (!title || !start || !end) { alert('请填写标题和时间'); return; }
  if (end <= start) { alert('结束时间必须晚于开始时间'); return; }

  if (type === 'course') {
    const weekday = parseInt(document.getElementById('eventWeekday').value, 10);
    const normalizedWk = weekday === 0 ? 7 : weekday;
    const data = { name: title, weekday: normalizedWk, start, end, location, type: 'Lecture', url };
    if (editingKind === 'course' && editingId) {
      const idx = courses.findIndex(c => c.id === editingId);
      if (idx > -1) courses[idx] = { ...courses[idx], ...data };
    } else {
      courses.push({ id: uuid(), ...data });
    }
  } else {
    const date = document.getElementById('eventDate').value;
    const remind = parseInt(document.getElementById('eventRemind').value, 10);
    if (!date) { alert('请选择日期'); return; }
    const data = { title, date, start, end, type, location, remind, url };
    if (editingKind === 'event' && editingId) {
      const idx = events.findIndex(e => e.id === editingId);
      if (idx > -1) events[idx] = { ...events[idx], ...data };
    } else {
      events.push({ id: uuid(), ...data });
    }
  }
  saveData();

  if (type === 'course' && selectedDate) {
    scheduleWeekOffset = 0;
  } else if (type !== 'course') {
    selectedDate = new Date((document.getElementById('eventDate').value) + 'T00:00:00');
    currentView = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
  }

  renderCalendar();
  renderEventsList();
  renderSchedule();
  closeModal();
}

function hidePopup() {
  document.getElementById('popupMenu').style.display = 'none';
}

function showPopupCourseMenu(clickEvent, course) {
  clickEvent.stopPropagation();
  const menu = document.getElementById('popupMenu');
  const hasUrl = !!(course.url && course.url.trim());
  const urlLink = hasUrl
    ? `<div class="pm-item" data-act="openurl"><span class="pm-icon">🔗</span>打开课件</div>`
    : `<div class="pm-item" data-act="addurl"><span class="pm-icon">➕</span>添加课件链接</div>`;

  menu.innerHTML = `
    <div style="padding:4px 12px 8px;font-size:12px;color:#95a5a6;">${escapeHtml(course.name)}</div>
    ${urlLink}
    <div class="pm-item" data-act="edit"><span class="pm-icon">✏️</span>编辑</div>
    <div class="pm-divider"></div>
    <div class="pm-item danger" data-act="delete"><span class="pm-icon">🗑</span>删除</div>
  `;
  menu.style.display = 'block';
  positionPopup(menu, clickEvent);

  const onItemClick = (ev) => {
    ev.stopPropagation();
    const act = ev.currentTarget.dataset.act;
    hidePopup();
    if (act === 'openurl') {
      window.open(course.url, '_blank');
    } else if (act === 'addurl') {
      openModal(null, course);
    } else if (act === 'edit') {
      openModal(null, course);
    } else if (act === 'delete') {
      if (confirm(`删除课程 "${course.name}"？（所有周都会移除）`)) {
        courses = courses.filter(c => c.id !== course.id);
        saveData();
        renderCalendar(); renderEventsList(); renderSchedule();
      }
    }
  };
  menu.querySelectorAll('.pm-item').forEach(el => el.addEventListener('click', onItemClick));
}

function showPopupEventMenu(clickEvent, event) {
  clickEvent.stopPropagation();
  const menu = document.getElementById('popupMenu');
  const hasUrl = !!(event.url && event.url.trim());
  const urlLabel = hasUrl ? '打开链接' : '添加链接';
  const urlIcon = hasUrl ? '🔗' : '➕';
  const urlAct = hasUrl ? 'openurl' : 'addurl';

  menu.innerHTML = `
    <div style="padding:4px 12px 8px;font-size:12px;color:#95a5a6;">${escapeHtml(event.title)}</div>
    ${hasUrl ? `<div class="pm-item" data-act="openurl"><span class="pm-icon">🔗</span>打开链接</div>` : `<div class="pm-item" data-act="addurl"><span class="pm-icon">➕</span>添加链接</div>`}
    <div class="pm-item" data-act="edit"><span class="pm-icon">✏️</span>编辑</div>
    <div class="pm-divider"></div>
    <div class="pm-item danger" data-act="delete"><span class="pm-icon">🗑</span>删除</div>
  `;
  menu.style.display = 'block';
  positionPopup(menu, clickEvent);

  const onItemClick = (ev) => {
    ev.stopPropagation();
    const act = ev.currentTarget.dataset.act;
    hidePopup();
    if (act === 'openurl') {
      window.open(event.url, '_blank');
    } else if (act === 'addurl' || act === 'edit') {
      openModal(event, null);
    } else if (act === 'delete') {
      if (confirm(`删除"${event.title}"？`)) {
        events = events.filter(e => e.id !== event.id);
        saveData();
        renderCalendar(); renderEventsList(); renderSchedule();
      }
    }
  };
  menu.querySelectorAll('.pm-item').forEach(el => el.addEventListener('click', onItemClick));
}

function positionPopup(menu, clickEvent) {
  const x = clickEvent.clientX;
  const y = clickEvent.clientY;
  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  menu.style.left = Math.min(Math.max(x - rect.width/2, 8), maxX) + 'px';
  menu.style.top = Math.min(y + 4, maxY) + 'px';
}

// 点击其他区域关闭弹出菜单

/* ================================================================
   提醒系统
================================================================ */
function updateReminderStatus() {
  const statusEl = document.getElementById('reminderStatus');
  if (!('Notification' in window)) {
    statusEl.textContent = '当前浏览器不支持通知';
    statusEl.className = 'reminder-status';
    return;
  }
  if (Notification.permission === 'granted') {
    statusEl.textContent = '✓ 浏览器通知已开启';
    statusEl.className = 'reminder-status enabled';
  } else if (Notification.permission !== 'denied') {
    statusEl.innerHTML = '<a href="#" id="enableNotify" style="color:#5a6fd6;text-decoration:none;font-weight:600;">点击开启浏览器通知 →</a>';
    statusEl.className = 'reminder-status';
    document.getElementById('enableNotify').onclick = (e) => {
      e.preventDefault();
      Notification.requestPermission().then(updateReminderStatus);
    };
  } else {
    statusEl.textContent = '通知已被拒绝，请到设置中允许';
    statusEl.className = 'reminder-status';
  }
}

function checkReminders() {
  const now = new Date();
  events.forEach(e => {
    if (!e.remind || e.remind === 0) return;
    const eventTime = new Date(`${e.date}T${e.start}:00`);
    const remindAt = new Date(eventTime.getTime() - e.remind * 60000);
    const diff = (remindAt - now) / 1000;
    if (diff > -30 && diff < 30) {
      const key = `reminded_${e.id}_${e.date}`;
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, '1');
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('📅 日历提醒', {
          body: `${e.title} 将于 ${e.start} 开始${e.location ? ' · ' + e.location : ''}`,
          tag: e.id
        });
      }
    }
  });
}

document.getElementById('nextBtn').onclick = () => {
  currentView = new Date(currentView.getFullYear(), currentView.getMonth() + 1, 1);
  renderCalendar();
};
document.getElementById('todayBtn').onclick = () => {
  currentView = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  selectedDate = TODAY;
  scheduleWeekOffset = 0;
  renderCalendar();
  renderEventsList();
  renderSchedule();
};
document.getElementById('schPrevBtn').onclick = () => { scheduleWeekOffset--; renderSchedule(); };
document.getElementById('schNextBtn').onclick = () => { scheduleWeekOffset++; renderSchedule(); };

// 点击日历侧边栏按钮 → 跳转课表
document.getElementById('jumpScheduleBtn').onclick = () => {
  scheduleWeekOffset = 0;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.view-tab[data-view="schedule"]').classList.add('active');
  document.getElementById('calendarView').classList.add('hidden');
  document.getElementById('scheduleView').classList.remove('hidden');
  renderSchedule();
};

document.getElementById('addBtn').onclick = () => openModal(null, null);
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = saveItem;
document.getElementById('eventType').onchange = updateModalFields;
document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
};

/* ================================================================
   初始化
================================================================ */
loadData();
renderCalendar();
renderEventsList();
renderSchedule();
updateReminderStatus();
setInterval(checkReminders, 15000);
checkReminders();

/* ================================================================
   开屏动画隐藏（三重保险：DOMContentLoaded / load / 兜底超时）
================================================================ */
function hideSplash() {
  const splash = document.getElementById('splashScreen');
  if (splash) {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }
}
// 1) DOM 就绪即隐藏（不等图片等资源加载）
if (document.readyState !== 'loading') {
  setTimeout(hideSplash, 800);
} else {
  document.addEventListener('DOMContentLoaded', () => setTimeout(hideSplash, 800));
}
// 2) load 事件后再隐藏一次（兜底）
window.addEventListener('load', () => setTimeout(hideSplash, 1200));
// 3) 绝对兜底：3 秒后强制移除，无论任何情况
setTimeout(() => {
  const s = document.getElementById('splashScreen');
  if (s) s.remove();
}, 3000);

/* ================================================================
   应用内版本检查与更新
================================================================ */
function compareVersion(v1, v2) {
  const a = v1.split('.').map(Number);
  const b = v2.split('.').map(Number);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] || 0, y = b[i] || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

function showUpdateDialog(remote) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;';
  const dialog = document.createElement('div');
  dialog.style.cssText = 'background:#fff;border-radius:16px;padding:24px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.2);';
  const logHtml = (remote.updateLog || '').split('\n').map(l => `<li>${escapeHtml(l)}</li>`).join('');
  dialog.innerHTML = `
    <h3 style="margin:0 0 12px;color:#4f2e7e;font-size:18px;">🎉 发现新版本 v${remote.version}</h3>
    <p style="color:#7f8c8d;font-size:13px;margin:0 0 14px;">当前版本 v${APP_VERSION}</p>
    <div style="background:#f5f7fa;border-radius:10px;padding:12px;margin-bottom:18px;max-height:160px;overflow-y:auto;">
      <div style="font-size:12px;color:#95a5a6;margin-bottom:6px;">更新内容：</div>
      <ul style="margin:0;padding-left:20px;font-size:13px;color:#2c3e50;line-height:1.8;">${logHtml || '<li>性能优化与 bug 修复</li>'}</ul>
    </div>
    <div style="display:flex;gap:10px;">
      <button id="updLater" style="flex:1;padding:11px;border:1px solid #e0e0e0;background:#fff;border-radius:10px;font-size:14px;color:#7f8c8d;cursor:pointer;">稍后</button>
      <button id="updNow" style="flex:1.2;padding:11px;border:none;background:linear-gradient(135deg,#5a6fd6,#6a4f9e);color:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">立即更新</button>
    </div>
  `;
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);
  dialog.querySelector('#updLater').onclick = () => overlay.remove();
  dialog.querySelector('#updNow').onclick = () => {
    // PWA 模式下重新加载即可（SW 缓存更新）；APK 模式下跳转下载
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         (navigator.standalone === true);
    if (isStandalone) {
      window.location.href = remote.downloadUrl;
    } else {
      window.location.reload();
    }
  };
}

async function checkForUpdate() {
  try {
    const res = await fetch(VERSION_CHECK_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const remote = await res.json();
    if (remote.versionCode > APP_VERSION_CODE ||
        (remote.version && compareVersion(remote.version, APP_VERSION) > 0)) {
      showUpdateDialog(remote);
    }
  } catch (e) { /* 离线或网络错误时静默 */ }
}

// 启动 2 秒后检查更新
setTimeout(checkForUpdate, 2000);

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // 检测到新版本时提示刷新
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateDialog({ version: APP_VERSION, updateLog: '页面已更新，点击刷新生效', downloadUrl: window.location.href });
          }
        });
      });
    }).catch(() => {});
  });
  // 强制注销所有旧 Service Worker（解决 v1 缓存卡死问题）
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => {
      if (r.active && r.active.scriptURL.endsWith('sw.js')) {
        caches.keys().then(keys => keys.forEach(k => { if (k !== 'calendar-v2') caches.delete(k); }));
      }
    });
  });
}
</script>
